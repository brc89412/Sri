st — try hoppers at a beach café"},{i:"🚗",t:"Private driver to Kandy — 3.5hrs through spice country",u:"https://maps.google.com/?q=Kandy+Sri+Lanka"},{i:"🌊",t:"Kandy Lake walk on arrival — gorgeous at dusk with the temple reflected"},{i:"🛕",t:"Evening puja at Temple of the Tooth (6:30pm) — drums, incense, candlelight",u:"https://www.maligawa.lk/"},{i:"🍛",t:"Dinner: rice & curry at a local spot on Dalada Veediya — order the dhal and jackfruit curries"}],gem:"The 6:30pm puja is the most atmospheric of the three daily ceremonies — the priests carry the gold reliquary casket as drummers pound in the courtyard. Far more intimate than daytime visits.",highlight:null,evening:{flag:"⏰ Day 3 starts at 6:30am for the temple puja — keep tonight easy.",note:null,options:[{name:"Kandy Lake night walk",desc:"Beautifully lit after dark, far fewer people than daytime. Free, and genuinely one of the nicest things to do in Kandy after sunset.",hours:"Open all night, no gate",price:"Free",mapsQuery:"Kandy Lake Sri Lanka"},{name:"Slightly Chilled Lounge Bar",desc:"Hilltop views over the lake and the whole city, cocktails and a proper bar menu. Casual, tourist-friendly.",hours:"~5pm–11pm",price:"~£4–7 a drink",mapsQuery:"Slightly Chilled Lounge Bar Kandy"}]},transport:"🚗 Private Driver Negombo → Kandy — ~$55 total (~3.5hrs)",links:[{l:"🛕 Temple of Tooth",u:"https://www.maligawa.lk/"},{l:"📍 Kandy Lake",u:"https://maps.google.com/?q=Kandy+Lake+Sri+Lanka"}]},{id:3,date:"Fri 14 Aug",region:"hills",title:"Kandy: Temples, Gardens & Hidden Forest",loc:"Kandy",lat:7.291,lng:80.634,min:20,max:28,rain:42,icon:"🌦",desc:"Morning cloud, sunny spells",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Temple_of_the_Tooth,_Sitting_Buddha_statues.-_Kandy.jpg?width=900",hours:[{t:"Temple of Tooth: 6:30am puja (start early!)",ok:!0},{t:"Peradeniya Gardens: 7:30am–5:30pm daily",ok:!0},{t:"Udawatta Kele: 6am–6pm daily (free)",ok:!0}],warn:null,acts:[{i:"🛕",t:"Temple of Tooth — 6:30am morning puja · spine-tingling drumming ceremony",u:"https://www.maligawa.lk/"},{i:"🌿",t:"Peradeniya Botanical Gardens — Asia's finest: royal palm avenue, giant bat colony, orchid house",u:"https://www.botanicgardens.gov.lk/"},{i:"🌳",t:"Udawatta Kele forest sanctuary — free, misty, howling monkeys, no tourists",u:"https://maps.google.com/?q=Udawatta+Kele+Sanctuary+Kandy"},{i:"🗻",t:"Bahirawakanda hilltop white Buddha — free 30min walk, best panorama of Kandy Lake"},{i:"🎨",t:"Evening: Arts & Crafts Centre on Sangaraja Mawatha — batik, lacquerware, silver"}],gem:"Udawatta Kele is the best-kept secret in Kandy. A royal forest reserve literally behind the temple, with monkey troops, meditation caves used by monks for centuries, and bird life most guides never mention. Go alone, go slowly.",highlight:null,evening:{flag:"⏰ Day 4 leaves the hotel at 7:30am sharp for the train — don't make it too late a night.",note:null,options:[{name:"Kandy Lake Club Cultural Show",desc:"Traditional Kandyan dance and drumming with a fire-walking finale — the classic Kandy evening. Performers in full traditional dress, genuinely well done.",hours:"Nightly ~7–8pm, ~1hr",price:"~£4–6pp",mapsQuery:"Kandy Lake Club Cultural Show"},{name:"Kandy Night Market",desc:"Street stalls near the clock tower — samosas, grilled corn with chilli and lime, fresh lassi. The best place in town to sample a lot in one go.",hours:"Evenings only, from ~6:30pm",price:"£1–3 per snack",mapsQuery:"Kandy Night Market Sri Lanka"},{name:"Arthur's Seat viewpoint",desc:"Panoramic sunset view over Kandy Lake, the Temple of the Tooth and the hills beyond. Free and popular with locals at dusk.",hours:"Best just before/at sunset",price:"Free",mapsQuery:"Arthur's Seat Kandy viewpoint"},{name:"The Pub, Dalada Veediya",desc:"Rooftop seating over Kandy's main street, relaxed local crowd, cold beer. Closes by 11pm.",hours:"~5pm–11pm",price:"~£3–5 a drink",mapsQuery:"The Pub Kandy Dalada Veediya"}]},transport:"🛺 Tuk-tuk/PickMe within Kandy (~$2–4 per ride)",links:[{l:"🛕 Temple of Tooth",u:"https://www.maligawa.lk/"},{l:"🌿 Peradeniya Gardens",u:"https://www.botanicgardens.gov.lk/"},{l:"📍 Udawatta Kele",u:"https://maps.google.com/?q=Udawatta+Kele+Sanctuary+Kandy"}]},{id:4,date:"Sat 15 Aug",region:"hills",title:"Drive → Nuwara Eliya → Train to Ella",loc:"Kandy → Nuwara Eliya → Nanu Oya → Ella",lat:6.867,lng:81.047,min:18,max:26,rain:45,icon:"🌦",desc:"Misty highlands — this is the magic",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Nine_Arches_Bridge_in_Ella.jpg?width=900",hours:[{t:"Nanu Oya station: board train ~12:00–13:00 (verify at station)",ok:!0},{t:"Train Nanu Oya → Ella: ~3.5–4hrs, arrives late afternoon",ok:!0},{t:"⚠️ Online booking full — see backup plan below (updated 14 Aug)",ok:!1}],warn:"The Kandy–Nanu Oya rail section remains CLOSED (Cyclone Ditwah). Drive from Kandy to Nanu Oya (2.5hrs). Optional 2hr stop in Nuwara Eliya en route. Nanu Oya→Ella itself IS running (resumed 20 June 2026) — see the backup plan below, online reservation is full but you have solid options.",acts:[{i:"🚗",t:"Drive Kandy → Nuwara Eliya (2hrs) — window views through tea estates the whole way"},{i:"☕",t:"Nuwara Eliya: colonial hill station — Gregory Lake, Grand Hotel tearoom, old post office",g:"Nuwara Eliya Sri Lanka Lake"},{i:"🚗",t:"Drive Nuwara Eliya → Nanu Oya station (30min)"},{i:"🚂",t:"Train Nanu Oya → Ella (~3.5hrs) — tea estates, waterfalls, cloud forest gorges",u:"https://www.12go.asia/en/train/nanu-oya/ella"},{i:"🌉",t:"Arrive Ella — Nine Arch Bridge at dusk if light allows"}],gem:"The Nanu Oya → Ella stretch is the crown jewel of Sri Lankan rail: the train dives through 46 tunnels, crosses 56 bridges and descends from 1,800m to 1,000m through cloud forest. Sit on the LEFT side facing forward.",highlight:null,trainPlan:{urgent:!0,summary:"Online booking is showing full — but you have three solid backup paths. Unreserved tickets are ALWAYS available on the day, so you cannot actually miss this train.",plans:[{label:"PLAN A",title:"Kandy Station counter — go today (14th)",desc:"Station counters run on the same national system as the website but sometimes show availability the website doesn't, including late-released quota and cancellations. Ask specifically for 2nd Class Reserved or Observation, Nanu Oya → Ella, Saturday 15 Aug. Counters 2 or 8 handle this route. Even though Kandy isn't currently on the running line, its counter can still issue reservations for journeys departing other stations.",action:"Go in person today — phone bookings aren't reliable for this."},{label:"PLAN B",title:"Nanu Oya Station counter — tomorrow morning",desc:"If Kandy has nothing today, your private car is going to Nanu Oya anyway. Get there by 10:30–11am and ask again at the counter — same-day reserved sales do happen locally even when online shows sold out. You'd have three trains to try for: ~12:07pm, ~14:36pm, or worst case ~16:08pm.",action:"Build in the extra hour at Nanu Oya before your target train."},{label:"PLAN C — bulletproof",title:"Unreserved 2nd or 3rd Class — always available",desc:"This is your guarantee. Unreserved tickets are sold at the counter starting about 1 hour before departure, no advance booking possible or needed, and they cannot sell out — standing room always exists. 3rd Class is about 40p, 2nd Class unreserved a little more. You may stand or sit in the doorway for busy stretches, but you will be on this train, on this route, seeing Nine Arch Bridge exactly the same as everyone else.",action:"Arrive 45–60 min before your chosen departure and queue at the counter."}],timetable:[{time:"~09:20am",train:"Slow/Mixed Train #1126",arrival:"~11:45am–12:15pm",notes:"Unreserved 2nd/3rd + Observation car"},{time:"~12:07pm",train:"Ella/Dunhinda Odyssey (Sat special)",arrival:"~14:47pm",notes:"Your original target — 1st/2nd reserved, 3rd unreserved, photo stops"},{time:"~14:36pm",train:"Express Train",arrival:"~17:00–17:19pm",notes:"Solid backup, still good light for photos"},{time:"~16:08pm",train:"Last train of the day",arrival:"~18:27–18:41pm",notes:"Cutting it close to dusk — true last resort"}],note:"Times cross-checked across multiple sources and typically accurate to within 10–15 minutes, but Sri Lanka Railways schedules shift slightly — confirm the board at the station. Sit on the LEFT side Nanu Oya→Ella for the best views regardless of which train you end up on."},evening:{flag:"⏰ Big travel day behind you — you'll land in Ella already tired.",note:null,options:[{name:"Cafe Chill",desc:"Ella's most iconic rooftop — pizzas, burgers, lamprais, easy vibe with valley views. The obvious first-night choice.",hours:"~11am–11pm",price:"~£5–9 a main",mapsQuery:"Cafe Chill Ella Sri Lanka"},{name:"Quiet dinner in the village",desc:"Honestly the better call after a full day on the road and rails — a simple local dinner and bed.",hours:"Most places open till ~10pm",price:"~£3–5pp local spot",mapsQuery:"Ella town centre Sri Lanka"}]},transport:"🚗 Car Kandy → Nanu Oya (~$45) · 🚂 Train Nanu Oya → Ella (~$10–15pp)",links:[{l:"🎟 Book Train eRail.lk",u:"https://eservices.railway.gov.lk/"},{l:"🎟 12Go Asia",u:"https://www.12go.asia/en/train/nanu-oya/ella"},{l:"📍 Nine Arch Bridge",u:"https://maps.google.com/?q=Nine+Arch+Bridge+Ella+Sri+Lanka"}]},{id:5,date:"Sun 16 Aug",region:"hills",title:"Ella: Little Adam's Peak & Nil Diya Pokuna",loc:"Ella",lat:6.867,lng:81.047,min:16,max:25,rain:45,icon:"⛅",desc:"Mist in mornings, sunny spells",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/SL_Ella_asv2020-01_img25_View_from_Little_Adams_Peak.jpg?width=900",hours:[{t:"Little Adam's Peak: open all day, free. Best before 9am or after 3pm",ok:!0},{t:"Nil Diya Pokuna: informal guide-based, no fixed hours — call ahead",ok:!0}],warn:"As it actually happened: Kinnelan's afternoon tea factory tour wasn't available (full-day only), so the afternoon got reshuffled on the fly — Nil Diya Pokuna and a quick Ravana Falls stop replaced it, and Buduruvagala moved to Day 6 instead.",acts:[{i:"🥾",t:"Little Adam's Peak — easy 2hr hike through tea estates, staggering valley views",g:"Little Adam's Peak Ella Sri Lanka"},{i:"🍛",t:"Lunch — Curd Shop (near the bus stand) for curd and honey, or a proper rice & curry spot",g:"Curd Shop Ella Sri Lanka bus stand"},{i:"💧",t:"Ravana Falls — quick roadside stop on the way to Nil Diya Pokuna, 15min, no detour cost",g:"Ravana Falls Ella Sri Lanka"},{i:"🕳️",t:"Nil Diya Pokuna — underground cave system, guided descent ~80m down, swim in the crystal-clear pool. Genuine highlight.",g:"Nil Diya Pokuna Sri Lanka"},{i:"🍛",t:"Dinner: egg hoppers + kottu roti at a local spot. Avoid the main tourist strip restaurants."}],gem:"Nil Diya Pokuna was the real find of the day — an underground cave descent to a hidden pool most tourists never hear about. Book the guide on arrival; there's no fixed schedule.",highlight:"Buduruvagala got bumped to Day 6, paired with Diyaluma Falls as a loop — worked out better anyway since Ella Rock's old evening slot was free.",evening:{flag:"⏰ Tomorrow's the big one — Ella Rock at 4am for sunrise. Get to bed properly tonight.",note:"A full day already — hike, cave, falls. Keep tonight simple.",options:[{name:"Quiet dinner near Madushanka",desc:"Nothing ambitious needed after today. You've earned an early one.",hours:"—",price:"—",mapsQuery:null}]},transport:"🛺 Tuk-tuk per stop — Little Adam's Peak trailhead, then Ravana Falls + Nil Diya Pokuna as a longer loop (~LKR 2,500–3,000 flat, driver waits through the cave visit).",links:[{l:"📍 Little Adam's Peak",u:"https://maps.google.com/?q=Little+Adam's+Peak+Ella"},{l:"📍 Curd Shop",u:"https://maps.google.com/?q=Curd+Shop+Ella+Sri+Lanka+bus+stand"},{l:"📍 Ravana Falls",u:"https://maps.google.com/?q=Ravana+Falls+Ella+Sri+Lanka"},{l:"📍 Nil Diya Pokuna",u:"https://maps.google.com/?q=Nil+Diya+Pokuna+Sri+Lanka"}]},{id:6,date:"Mon 17 Aug",region:"hills",title:"Ella Rock Sunrise + Diyaluma Falls + Buduruvagala",loc:"Ella",lat:6.867,lng:81.047,min:16,max:25,rain:50,icon:"🌦",desc:"Cloud & sun — perfect hiking temps",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Heaven_Mountains,_Ella,_Sri_Lanka.jpg?width=900",hours:[{t:"Ella Rock sunrise tour: 4:00am start (Ella Excursions Tours)",ok:!0},{t:"Diyaluma Falls: 6am–5pm, free entry",ok:!0},{t:"Buduruvagala: daylight hours, small entry fee",ok:!0}],warn:"As it actually happened: 4am guided sunrise hike up Ella Rock, back at the hotel ~10am for breakfast, then a big afternoon — Diyaluma Falls and Buduruvagala combined as one loop, not returning to Ella in between.",acts:[{i:"🌅",t:"Ella Rock — 4:00am guided sunrise hike, 1,041m summit, genuinely one of the best views of the trip",g:"Ella Rock Sri Lanka"},{i:"🍳",t:"Back at hotel ~10am — proper breakfast, well-earned"},{i:"🏊",t:"Diyaluma Falls — steep 20–45min climb to the upper pools, swim in the natural infinity pools",g:"Diyaluma Falls Sri Lanka"},{i:"🗿",t:"Buduruvagala — continued straight there from Diyaluma (~22km), not back through Ella. Quiet, ancient rock-cut Buddhas.",g:"Buduruvagala Sri Lanka"}],gem:"Doing Diyaluma and Buduruvagala as one loop — instead of two separate trips from Ella — saved real time and made for a genuinely big, satisfying day without the drive doubling back on itself.",highlight:"Ella Excursions Tours' 4am sunrise slot on Ella Rock was worth the early start — quieter trail, cooler climb, and the view arrived exactly on cue.",evening:{flag:"You did Ella Rock, Diyaluma, AND Buduruvagala today — genuinely one of the biggest days of the whole trip.",note:"Recovery, not exploring. Tomorrow's a long travel day to Passekudah.",options:[{name:"Quiet dinner, early night",desc:"You've more than earned it — three major stops in one day.",hours:"—",price:"—",mapsQuery:null}]},transport:"🚐 4am pickup for Ella Rock guide · 🛺 Full-loop tuk-tuk for Diyaluma + Buduruvagala — agree ONE flat all-in price covering both stops and the wait (fair range LKR 6,000–9,000 total, confirm before departing).",links:[{l:"📍 Ella Rock Trail",u:"https://maps.google.com/?q=Ella+Rock+Sri+Lanka"},{l:"📍 Diyaluma Falls",u:"https://maps.google.com/?q=Diyaluma+Falls+Sri+Lanka"},{l:"📍 Buduruvagala",u:"https://maps.google.com/?q=Buduruvagala+Sri+Lanka"}]},{id:7,date:"Tue 18 Aug",region:"coast",title:"East Bound — Passekudah",loc:"Ella → Passekudah",lat:7.917,lng:81.55,min:26,max:33,rain:12,icon:"🌤",desc:"Warming fast — monsoon divide",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Maalu_Maalu_Beach_Resort,_Pasikuda,_Sri_Lanka.jpg?width=900",hours:[{t:"Perahera Night 1 (Kumbal) in Kandy tonight — we'll catch the spectacular finale Aug 26",ok:!1}],warn:"Some of the Mahiyangana–Bibile–Ampara stretch has rougher road patches — build in a little extra patience on the middle section.",acts:[{i:"🙏",t:"Mahamevnawa Monastery, Kumbalwela — ~7km out of Ella, short climb up to a 1,300m hilltop monastery, genuinely peaceful",g:"Mahamevnawa Buddhist Monastery Kumbalwela"},{i:"🚗",t:"Continue toward and through Badulla — this stretch is the scenic descent"},{i:"🍃",t:"Uva Halpewatte Tea Factory — genuine on-route stop, ~$10pp standard tour, real machinery and a proper tasting",g:"Uva Halpewatte Tea Factory Ella"},{i:"🚗",t:"Onward via Mahiyangana–Bibile–Ampara toward the coast (~3.5–4.5hrs total driving)"},{i:"🍛",t:"Lunch en route — ask your driver, likely Mahiyangana or Bibile, fewer reliable stops on this stretch than you're used to"},{i:"🌊",t:"Arrive Passekudah ~3:30–4pm, check into Amethyst Resort"},{i:"🦐",t:"Sunset dinner: grilled fresh prawns on the beach, first cold Arrack Sour of the coast leg"}],gem:"Uva Halpewatte turned out to be the tea factory visit that never happened in Ella — right on the Badulla road, zero detour, and genuinely worth the ~1–1.5hrs.",highlight:"🎆 The Esala Perahera begins in Kandy TONIGHT (Aug 18 — Kumbal nights start). We'll catch the spectacular Randoli finale on Aug 26 at the end of the trip. Best of both worlds.",evening:{flag:null,note:null,options:[{name:"Ask about a beach bonfire",desc:"Several Passekudah properties run informal bonfires on clear nights — not scheduled, just ask at check-in.",hours:"After dark, weather permitting",price:"Usually free for guests",mapsQuery:null},{name:"Resort cultural night",desc:"Uga Bay, Amaya Beach and Maalu Maalu sometimes host live bands or traditional dance for guests — worth asking what's on tonight.",hours:"Evenings, varies",price:"Often free for guests",mapsQuery:"Uga Bay Pasikuda"},{name:"Watch the fishing fleet return",desc:"Near the public stretch of beach around dusk — small wooden boats, nets, completely authentic and free.",hours:"~5:30–6:30pm",price:"Free",mapsQuery:"Passikudah public beach"}]},transport:"🚗 Private driver Ella → Kumbalwela → Badulla → Passekudah — ~3.5–4.5hrs total driving, roughly $70–90 total",links:[{l:"🙏 Mahamevnawa Monastery",u:"https://maps.google.com/?q=Mahamevnawa+Buddhist+Monastery+Kumbalwela"},{l:"📍 Passekudah Bay",u:"https://maps.google.com/?q=Passekudah+Bay+Sri+Lanka"},{l:"🍃 Uva Halpewatte",u:"https://maps.google.com/?q=Uva+Halpewatte+Tea+Factory+Ella"}]},{id:8,date:"Wed 19 Aug",region:"coast",title:"Passekudah: Kayankerni Reef, Village & Beach",loc:"Passekudah",lat:7.917,lng:81.55,min:26,max:33,rain:10,icon:"☀️",desc:"Gloriously sunny — east coast peak",special:!1,img:"https://picsum.photos/seed/passekudah-snorkel-reef2/900/400",hours:[{t:"Snorkel reef: best 7–11am before wind picks up in afternoon",ok:!0}],warn:"As it actually happened: 6am boat trip and snorkeling in the Kayankerni Marine Sanctuary, then a relaxed pool/beach afternoon, then the Valaichenai fishing village around 4pm to watch the fleet return.",acts:[{i:"🚤",t:"6am boat trip — snorkeling in the Kayankerni Marine Sanctuary, protected reef, genuinely the highlight"},{i:"🏊",t:"Back to the resort mid-morning — pool and beach, proper recovery time"},{i:"🍛",t:"Lunch at the resort"},{i:"🛺",t:"Tuk-tuk to Valaichenai fishing village ~4pm — fleet returns around this time, authentic and free",g:"Valaichenai Sri Lanka"}],gem:"The 6am start for Kayankerni was worth it — best light, calmest water, and the reef mostly to yourselves before the day-trip crowds arrive.",highlight:null,evening:{flag:"⏰ Drive north to Nilaveli tomorrow — nothing urgent, just don't make it a very late one.",note:null,options:[{name:"Beach stargazing after dinner",desc:"Minimal light pollution here — genuinely one of the clearest night skies of the whole trip.",hours:"After dark",price:"Free",mapsQuery:null},{name:"Kalkudah Beach walk",desc:"The quieter neighbouring beach — fishermen preparing nets at dusk, far fewer people than Passekudah proper.",hours:"Best at dusk",price:"Free",mapsQuery:"Kalkudah Beach Sri Lanka"},{name:"Seafood dinner — hot butter cuttlefish",desc:"A genuine east-coast speciality worth seeking out specifically, most resort restaurants do a version.",hours:"Dinner service",price:"~£6–10pp",mapsQuery:null}]},transport:"🚤 Boat trip booked directly (avoided hotel markup) · 🛺 Tuk-tuk to Valaichenai (~$3–5)",links:[{l:"📍 Passekudah Beach",u:"https://maps.google.com/?q=Passekudah+Beach+Sri+Lanka"},{l:"📍 Valaichenai",u:"https://maps.google.com/?q=Valaichenai+Sri+Lanka"},{l:"📍 Kayankerni Marine Sanctuary",u:"https://maps.google.com/?q=Kayankerni+Marine+Sanctuary+Sri+Lanka"}]},{id:9,date:"Thu 20 Aug",region:"coast",title:"Pigeon Island Boat Trip → Nilaveli",loc:"Passekudah → Uppuveli → Nilaveli",lat:8.581,lng:81.215,min:27,max:34,rain:10,icon:"☀️",desc:"Perfect sunshine — best beach day",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Pigeon_Island_National_Park,_Sri_Lanka.jpg?width=900",hours:[{t:"Trinco Bay Dive Center check-in: 8:00am · Safety briefing: 8:30am · Boat departs: 9:00am",ok:!0}],warn:"Early one — 4:50am wake, no breakfast, no sunrise walk this time. Bags drop at Vitamin Sea BEFORE the dive center, and cash gets withdrawn on the way too, since none of it can happen the night before or after boarding.",acts:[{i:"🎒",t:"Bag drop at Vitamin Sea Beach Cabana — proper window, not rushed"},{i:"💵",t:"ATM stop en route — 26,000 LKR total (13k each), confirmed reliable spot with the driver the night before"},{i:"🚤",t:"Trinco Bay Dive Center, Fernando's Beach Market, Uppuveli — check-in 8am, briefing 8:30am, boat departs 9am",u:"https://maps.google.com/?q=Trinco+Bay+Dive+Center+Uppuveli"},{i:"🐠",t:"Pigeon Island snorkeling — booked via GetYourGuide, $52pp, reef sharks and turtles, 3hrs"},{i:"🍛",t:"Lunch in Uppuveli — better spread of restaurants than Nilaveli, worth the stop"},{i:"🛍️",t:"Browse Fernando's Beach Market — right there at the dive center, no extra trip needed"},{i:"🏖️",t:"Check in at Vitamin Sea, Nilaveli — proper beach afternoon, pristine and undeveloped"}],gem:"Uppuveli for lunch instead of rushing back to Nilaveli hungry — small change, better food options, zero extra effort since you're already there.",highlight:"Booked the Kayankerni-style trip independently via GetYourGuide instead of the hotel's markup — real savings for the same boat, same reef.",evening:{flag:null,note:"You'll have had a very early start and a full water morning — keep tonight simple.",options:[{name:"Sunset on Nilaveli Beach",desc:"Genuinely one of the best sunset stretches on the whole trip, and you're already checked in.",hours:"~6:15–6:25pm",price:"Free",mapsQuery:null},{name:"Dinner at Vitamin Sea or nearby",desc:"Nothing ambitious needed — an early one tonight given the 4:50am start.",hours:"—",price:"—",mapsQuery:null}]},transport:"🚗 Private driver: Passekudah → Nilaveli (bag drop) → ATM → Uppuveli (dive center) → back to Nilaveli",links:[{l:"🎫 GetYourGuide booking",u:"https://www.getyourguide.com/pigeon-island-sri-lanka-l215989/"},{l:"📍 Trinco Bay Dive Center",u:"https://maps.google.com/?q=Trinco+Bay+Dive+Center+Uppuveli"},{l:"📍 Nilaveli Beach",u:"https://maps.google.com/?q=Nilaveli+Beach+Sri+Lanka"}]},{id:10,date:"Fri 21 Aug",region:"coast",title:"White Rock Snorkel → Fort Frederick & Koneswaram → Crocodile Lagoon",loc:"Trincomalee",lat:8.567,lng:81.233,min:26,max:33,rain:12,icon:"⛅",desc:"Warm, breezy, mostly sunny",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Koneswaram_Temple_-_Trincomalee.jpg?width=900",hours:[{t:"White Rock boat: 7am departure — done first thing this morning",ok:!0},{t:"Fort Frederick: 6am–6pm daily. Free.",ok:!0},{t:"Koneswaram Temple: 6am–8pm daily. Free (donation).",ok:!0},{t:"Crocodile lagoon boat: best sightings early morning or late afternoon — 4:30–6:30pm slot",ok:!0}],warn:"Plan changed on the day: whale watching dropped (locals reporting poor sightings all week, and you'd already had two brilliant snorkeling days). Kanniya Hot Springs dropped too — real reviews confirmed it's a modest bucket-shower ritual, not a spa, and not worth prioritizing over what replaced it.",acts:[{i:"🤿",t:"White Rock — 7am snorkel trip, one of three reef zones near Pigeon Island, done first thing this morning",g:"White Rock Snorkeling Nilaveli Sri Lanka"},{i:"🏰",t:"Fort Frederick — British colonial fort, free-roaming deer inside the ramparts",u:"https://maps.google.com/?q=Fort+Frederick+Trincomalee+Sri+Lanka"},{i:"🛕",t:"Koneswaram Temple on Swami Rock — cliff-top Hindu temple, 100m above the ocean. Also historically a spot to scan for whales from land, free bonus.",g:"Koneswaram Temple Trincomalee"},{i:"🐊",t:"Wild crocodile lagoon boat tour — 4:30–6:30pm, guided mangrove/lagoon safari ending with sunset over the water",g:"Crocodile Lagoon Boat Safari Nilaveli"}],gem:"White Rock turned out to be the smarter snorkel choice today — same reef family as Pigeon Island, less crowded, no separate national park fee.",highlight:"Late afternoon is genuinely the recommended time for crocodile sightings, not just a convenient slot — so this ended up being better timing than the original hot-springs plan, not a compromise.",evening:{flag:"⏰ Travel to Habarana tomorrow (2.5hrs) — not urgent, but an early-ish start helps.",note:"Dinner after the crocodile tour, easy night.",options:[{name:"Nilaveli Beach Bar and Restaurant",desc:"Relaxed sunset drinks and seafood right on the beach — easy, unpretentious, exactly what this coast is for.",hours:"~4pm–10:30pm",price:"~£5–9pp for dinner",mapsQuery:"Nilaveli Beach Bar and Restaurant"},{name:"Uppuveli restaurant strip",desc:"More choice of bars and restaurants than Nilaveli if you fancy a change of scene — about 15min by tuk-tuk.",hours:"Evenings",price:"~£4–8pp",mapsQuery:"Uppuveli Beach restaurants"}]},transport:"🛺 Tuk-tuk/PickMe within Trincomalee (~$3–6) · boat operators arranged directly, not via hotel",links:[{l:"🤿 White Rock",u:"https://maps.google.com/?q=White+Rock+Snorkeling+Nilaveli+Sri+Lanka"},{l:"📍 Fort Frederick",u:"https://maps.google.com/?q=Fort+Frederick+Trincomalee+Sri+Lanka"},{l:"📍 Koneswaram Temple",u:"https://maps.google.com/?q=Koneswaram+Temple+Trincomalee"},{l:"🐊 Crocodile Lagoon Tour",u:"https://maps.google.com/?q=Crocodile+Lagoon+Boat+Safari+Nilaveli"}]},{id:11,date:"Sat 22 Aug",region:"triangle",title:"Kantale Tank → Habarana",loc:"Trincomalee → Habarana",lat:8.003,lng:80.751,min:25,max:35,rain:18,icon:"⛅",desc:"Getting hotter, mostly dry",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Habarana_wewa.jpg?width=900",hours:[{t:"Habarana Lake walk: best at dawn (~5:30am) and dusk",ok:!0}],warn:null,acts:[{i:"🚗",t:"Private driver Trincomalee → Habarana — 2.5hrs through dry zone jungle"},{i:"🌊",t:"Kantale Tank — genuinely on the way, worth a quick photo stop even if you don't have time to linger; longer if you want the walk and roadside buffalo curd",g:"Kantale Tank Sri Lanka"},{i:"🐘",t:"Habarana Lake at dusk — wild elephants sometimes come to drink (genuinely)"},{i:"🏊",t:"Lodge with a pool: 35°C heat makes this non-negotiable in the Cultural Triangle"},{i:"🌿",t:"Ritigala Strict Nature Reserve nearby — jungle monastery ruins, almost no visitors. Ask lodge for guide."},{i:"🌙",t:"Early night: Sigiriya opens at 7am, you want to be first through the gate tomorrow"}],gem:"Ritigala is an extraordinary secret — dense forest ruins of a forest monastery used by ascetic monks for 2,000 years. The jungle has reclaimed the stone platforms and walkways. Eerie, atmospheric, and all yours.",highlight:"Kantale Tank turned a transit day into something a bit more — a real stretch-your-legs stop with genuine history (6th-century irrigation engineering) and a regional buffalo curd that's noticeably richer than what you had in Ella.",evening:{flag:"⏰ Sigiriya opens at 7am tomorrow — a proper early one, keep tonight relaxed.",note:null,options:[{name:"Habarana Cultural Show",desc:"Traditional dance and music, nightly — ask your hotel where it's showing locally, usually a short walk or tuk-tuk.",hours:"~6:30pm, ~2hrs",price:"~£4–6pp",mapsQuery:"Habarana cultural dance show"},{name:"Lake House Kitchen",desc:"Lakeside restaurant near Habarana Village by Cinnamon — sunset over the water, arrack cocktails, genuinely good food. About 10min walk from the main road.",hours:"~5pm–10pm",price:"~£6–10pp",mapsQuery:"Lake House Kitchen Habarana"},{name:"Ask about elephants at the fence",desc:"Wild elephants sometimes come right up to the lodge boundary after dark — ask staff if any have been spotted this week.",hours:"After dark",price:"Free",mapsQuery:null}]},transport:"🚗 Private Driver Trincomalee → Kantale Tank → Habarana — ~$50 total (~2.5hrs incl. stop)",links:[{l:"🌊 Kantale Tank",u:"https://maps.google.com/?q=Kantale+Tank+Sri+Lanka"},{l:"📍 Habarana",u:"https://maps.google.com/?q=Habarana+Sri+Lanka"},{l:"📍 Ritigala",u:"https://maps.google.com/?q=Ritigala+Strict+Nature+Reserve+Sri+Lanka"}]},{id:12,date:"Sun 23 Aug",region:"triangle",title:"Sigiriya Lion Rock (Sunrise) + Pidurangala Sunset",loc:"Sigiriya + Pidurangala",lat:7.957,lng:80.76,min:24,max:36,rain:20,icon:"☀️",desc:"Very hot — early entry genuinely worth it",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Sigiriya_Rock_fortress.jpg?width=900",hours:[{t:"E-Ticket Counter (side building): open from ~5:00am for early/sunrise climbers",ok:!0},{t:"Main ticket office: opens ~6:30–7:00am · Last entry 5:00pm · Closes 5:30pm",ok:!0},{t:"Frescoes area closes 5:45pm · Museum: 8am–5pm",ok:!0},{t:"Pidurangala: Open all day · Best 4:30–6pm for sunset view of Sigiriya",ok:!0},{t:"⚠️ Randoli Perahera begins TONIGHT in Kandy (23–26 Aug)",ok:!1}],warn:"Sunrise around 6:00–6:15am this time of year. The climb takes 30min–1hr, so you won't necessarily be at the summit for the exact first light — but you'll be climbing in cool dawn air, well ahead of the 7am+ crowds, which is the real win.",acts:[{i:"🦁",t:"Sigiriya Lion Rock — depart hotel ~5:15am, ticket at the E-Ticket Counter if the main office isn't open yet, start climbing before 6am",u:"https://maps.google.com/?q=Sigiriya+Rock+Fortress+Sri+Lanka"},{i:"🎨",t:"Sigiriya Maidens frescoes — 1,500-year-old paintings of celestial women, unique in the world"},{i:"🪞",t:"Mirror Wall — 8th century graffiti carved by ancient visitors. Sri Lanka's oldest social media."},{i:"🌄",t:"Pidurangala Rock at sunset — $2, same view as Sigiriya in reverse, 95% fewer tourists",g:"Pidurangala Rock sunset Sri Lanka"},{i:"🏺",t:"Aluvihara Rock Temple — where Buddhist canon was first written (1st c BC), eerily quiet",g:"Aluvihara Rock Temple Matale Sri Lanka"}],gem:"Worth knowing: Pidurangala sits north of Sigiriya, so the sun doesn't literally set behind the rock — that’s actually a sunrise effect (Sigiriya's east face glows at dawn). What you get at sunset instead is Sigiriya's silhouette darkening against a colourful dusk sky, plus a genuine west-facing sunset over the forest and reservoirs. Different photo, still stunning. The 20-minute scramble costs $2.",highlight:"🎆 Randoli Perahera grand processions begin in Kandy tonight (Aug 23). We attend Aug 26 — the penultimate finale night, most spectacular of all.",evening:{flag:"⏰ Another early one tomorrow — Dambulla then Minneriya's evening safari.",note:"Pidurangala sunset is tonight's whole evening — dinner after is plenty. No need to plan anything more, it's already a full day.",options:[]},transport:"🚗 Private Driver to Sigiriya — pre-dawn pickup ~5:15am, not a tuk-tuk, confirm timing with driver tonight (~20min from Habarana) · 🛺 Tuk-tuk to Pidurangala + Aluvihara later",links:[{l:"📍 Sigiriya Rock",u:"https://maps.google.com/?q=Sigiriya+Rock+Fortress+Sri+Lanka"},{l:"📍 Pidurangala",u:"https://maps.google.com/?q=Pidurangala+Rock+Sigiriya"},{l:"📍 Aluvihara Temple",u:"https://maps.google.com/?q=Aluvihara+Rock+Temple+Matale"}]},{id:13,date:"Mon 24 Aug",region:"triangle",title:"Dambulla Cave Temples + Kaudulla Elephant Safari",loc:"Dambulla → Kaudulla",lat:8.03,lng:80.649,min:24,max:35,rain:22,icon:"☀️",desc:"Hot & dry — Kaudulla golden hour",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Elephants_of_Minneriya_National_Park,_Sri_Lanka.jpg?width=900",hours:[{t:"Dambulla Cave Temples: 7:00am–7:00pm daily — go early, arrive by 8am to beat tour buses",ok:!0},{t:"Kaudulla safari (hotel-booked): pickup 1:30pm, park closes 6pm — vehicles must be out",ok:!0},{t:"Park entrance: cash only (LKR), confirm with hotel whether your $100pp already covers it",ok:!1}],warn:"Booked through the hotel: private jeep to Kaudulla, $100pp, includes driver/jeep/entrance, pickup 1:30pm. Confirm the entrance-fee inclusion tonight, and have LKR cash on hand regardless — park counters don't take cards.",acts:[{i:"🕌",t:"Dambulla — buy your ticket at the BASE before climbing (only one entrance has the ticket counter — ask your driver which one, or you'll end up climbing twice)",u:"https://maps.google.com/?q=Dambulla+Cave+Temple+Sri+Lanka"},{i:"🧦",t:"~364 steps to the top, 10–20min climb — a third of Sigiriya's step count, no scrambling, just stairs. Bring socks, the stone gets hot underfoot."},{i:"🏆",t:"Priority inside: Cave 2 (Maharaja Vihara) — the big one, a third of all Dambulla's Buddha statues are here. Cave 3 next — 9m reclining Buddha, 50+ more statues. Caves 4–5 skippable if short on time."},{i:"✨",t:"In Cave 1, look for the traces of gold on the reclining Buddha's elbow — easy to miss, genuinely worth seeking out"},{i:"🏅",t:"Golden Temple + 30m golden Buddha statue at the base — free, right on your way down, don't skip it. The Buddha Museum underneath is skippable."},{i:"🐘",t:'Kaudulla National Park — "The Gathering": elephants seasonally concentrated here this week, 200–400 possible at the reservoir',u:"https://maps.google.com/?q=Kaudulla+National+Park+Sri+Lanka"},{i:"🌅",t:"Watch elephant families arrive in waves from the jungle — calves, bulls, matriarchs"}],gem:"The Gathering — wherever the elephants currently are — is one of the 10 greatest wildlife spectacles on Earth. If you see 200+ elephants and a watering hole full of calves at sunset, no photograph does it justice.",highlight:null,evening:{flag:"⏰ Tomorrow is the longest day of the trip — Polonnaruwa, Anuradhapura, Mihintale, then Kandy. An early, easy night matters tonight.",note:null,options:[{name:"Dinner at the lodge",desc:"Post-safari wind-down — nothing more ambitious needed tonight.",hours:"—",price:"—",mapsQuery:null}]},transport:"🚗 Private Driver to Dambulla (~30min from Habarana) · 🚙 Private jeep to Kaudulla (hotel-booked, $100pp, 1:30pm pickup, ~40min drive)",links:[{l:"🕌 Dambulla Cave Temple",u:"https://maps.google.com/?q=Dambulla+Cave+Temple+Sri+Lanka"},{l:"🐘 Kaudulla NP",u:"https://maps.google.com/?q=Kaudulla+National+Park+Sri+Lanka"}]},{id:14,date:"Tue 25 Aug",region:"triangle",title:"Polonnaruwa + Anuradhapura + Mihintale",loc:"Polonnaruwa → Anuradhapura → Kandy",lat:8.311,lng:80.404,min:25,max:36,rain:20,icon:"☀️",desc:"Hot & dry — start at 6am",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Ruwanwelisaya.jpg?width=900",hours:[{t:"Polonnaruwa: 7:00am–6:00pm · rent bicycle at gate ($2)",ok:!0},{t:"Anuradhapura: 6:00am–6:00pm · Sri Maha Bodhi open all day",ok:!0},{t:"Mihintale: 6:00am–6:00pm · 1,840 stone steps · Free",ok:!0}],warn:"Long day — 6am start essential. Habarana → Polonnaruwa (45min) → Anuradhapura (1.5hrs) → Mihintale (20min from Anuradhapura) → Kandy (3.5hrs). Arrive Kandy ~8–9pm in time for tomorrow's Perahera.",acts:[{i:"🚲",t:"Polonnaruwa by bicycle — Gal Vihara giant rock Buddhas are unmissable",u:"https://maps.google.com/?q=Polonnaruwa+Ancient+City+Sri+Lanka"},{i:"🌳",t:"Sri Maha Bodhi, Anuradhapura — world's oldest documented tree (planted 288 BC)",g:"Jaya Sri Maha Bodhi Anuradhapura"},{i:"🏯",t:"Ruwanwelisaya + Jetavanaramaya stupas — colossal 2,000-year-old white monuments"},{i:"⛰️",t:"Mihintale — birthplace of Buddhism in Sri Lanka (247 BC). 1,840 steps, hilltop dagobas, panoramic views. Add 2hrs.",g:"Mihintale Sri Lanka"},{i:"🚗",t:"Drive to Kandy (3.5hrs) — arrive ~8–9pm ready for tomorrow night"}],gem:"Mihintale in the late afternoon light is one of the most profound places in Sri Lanka. The hilltop where the monk Mahinda converted the king to Buddhism in 247 BC — 13km from Anuradhapura, $3 entry, almost no tourists.",highlight:"🎆 TOMORROW NIGHT: Randoli Perahera penultimate grand finale in Kandy. You are sleeping in Kandy tonight for this reason. Book your viewing stand seat NOW.",evening:{flag:null,note:"You'll roll into Kandy around 8pm after the longest day of the trip. A simple dinner near the hotel and straight to bed — you've earned it.",options:[]},transport:"🚗 Private Driver all day: Habarana → Polonnaruwa → Anuradhapura → Mihintale → Kandy",links:[{l:"📍 Polonnaruwa",u:"https://maps.google.com/?q=Polonnaruwa+Ancient+City+Sri+Lanka"},{l:"📍 Anuradhapura",u:"https://maps.google.com/?q=Anuradhapura+Sri+Lanka"},{l:"📍 Mihintale",u:"https://maps.google.com/?q=Mihintale+Sri+Lanka"}]},{id:15,date:"Wed 26 Aug",region:"finish",title:"🗼 Ambuluwawa Tower → 🎆 KANDY: Randoli Perahera Grand Night",loc:"Kandy",lat:7.291,lng:80.634,min:20,max:28,rain:38,icon:"🌦",desc:"Warm evening — perfect for the procession",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Esala_Perahera_(Procession)_2006,_Kandy,_Sri_Lanka.jpg?width=900",hours:[{t:"Ambuluwawa Tower: 7:30am–5pm, best climb before 10:30am to beat heat and crowds",ok:!0},{t:"Perahera procession: starts ~8:00pm, runs 2–3hrs (be in your stand by 7:30pm)",ok:!0},{t:"Viewing stands: book seats in advance via hotel or kandyperaherabookings.com",ok:!1}],warn:"Skipped the Temple of Tooth day visit this time — you've seen the puja a few times already. Ambuluwawa Tower replaces it as this morning's activity instead.",acts:[{i:"🗼",t:"Ambuluwawa Tower — depart Kandy ~7:00am, climb the spiral tower before 10:30am for 360° views, back by ~11:30am",g:"Ambuluwawa Tower Gampola"},{i:"🛍",t:"Afternoon: browse Kandy's craft shops for last gifts — batik, Ceylon tea, spices, gems"},{i:"🪑",t:"Be in your viewing stand seat by 7:30pm sharp — the procession begins at ~8pm"},{i:"🎆",t:"RANDOLI PERAHERA — 50–100 decorated elephants, 1,500 performers, fire dancers, whip crackers, Kandyan drummers",u:"https://kandyesalaperahera.com/dates2026/"},{i:"🌙",t:"The Maligawa Tusker carries the sacred golden casket — the most revered elephant in Sri Lanka"}],gem:"Ambuluwawa entry is cash only (~2,000 LKR pp) — bring local currency, cards aren't accepted at the gate.",highlight:"★ This is the penultimate Randoli night — one of the most spectacular of the entire festival. The full complement of elephants, the most elaborate costumes, the longest procession. On your last full evening in Sri Lanka.",evening:{flag:"⏰ Early departure tomorrow (5:45am) for Pinnawala en route to the airport — get to bed at a sensible time tonight despite the Perahera running late.",note:"This IS the evening plan — eat something light beforehand, the Randoli Perahera runs roughly 8–10:30pm and you'll be on your feet in the viewing stand the whole time.",options:[]},transport:"🚗 Private driver Kandy → Ambuluwawa → Kandy — ~1hr each way, ~$40–50 total · 🛺 Tuk-tuk/PickMe within Kandy for the rest of the day",links:[{l:"🗼 Ambuluwawa Tower",u:"https://maps.google.com/?q=Ambuluwawa+Tower+Gampola"},{l:"🎆 Official Perahera Dates",u:"https://kandyesalaperahera.com/dates2026/"},{l:"🪑 Book Viewing Seats",u:"https://www.kandyperaherabookings.com/"}]},{id:16,date:"Thu 27 Aug",region:"transit",title:"🐘 Pinnawala → Fly Home",loc:"Kandy → Pinnawala → CMB Airport · Depart 14:10",lat:7.18,lng:79.884,min:26,max:32,rain:30,icon:"⛅",desc:"Warm, coastal humidity",special:!1,img:"https://picsum.photos/seed/colombo-departure-lights/900/400",hours:[{t:"Pinnawala gates: ~8:00am · Morning feeding: 9:15–10:00am",ok:!0},{t:"HARD departure from Pinnawala: 10:00am — non-negotiable, protects your flight",ok:!1},{t:"Depart Kandy 5:45am — earlier than usual specifically to make this work safely",ok:!1}],warn:"Early departure today (5:45am, no puja) to fit Pinnawala in safely. This is a genuinely tighter airport buffer than the rest of the trip — roughly 1–1.5hrs instead of the usual 2hrs, because Pinnawala adds real driving time and isn't directly on the fastest Kandy–CMB route. Treat 10:00am as a hard leave-by time from the orphanage regardless of what's happening there — that's the one thing protecting the flight.",acts:[{i:"🚗",t:"Depart Kandy 5:45am — no puja this time, straight to Pinnawala (~1–1.5hrs)"},{i:"🐘",t:"Pinnawala Elephant Orphanage — gates open ~8am, catch the 9:15–10am morning feeding",g:"Pinnawala Elephant Orphanage"},{i:"⏰",t:"HARD departure from Pinnawala by 10:00am — no exceptions, this is what protects your flight buffer"},{i:"🚗",t:"Drive Pinnawala → CMB Airport (~2.5–3hrs)"},{i:"✈️",t:"Depart CMB 14:10 — carry your full heart and very full luggage"}],gem:"If the feeding session is still going when 10am hits, leave anyway. You've seen the highlight — the flight doesn't wait.",highlight:null,evening:{flag:null,note:"Mid-flight by evening — homeward bound.",options:[]},transport:"🚗 Private Driver Kandy → Pinnawala → CMB Airport — ~4.5–5hrs total driving, roughly $90–110",links:[{l:"🐘 Pinnawala Elephant Orphanage",u:"https://maps.google.com/?q=Pinnawala+Elephant+Orphanage"},{l:"✈️ CMB Airport",u:"https://maps.google.com/?q=Bandaranaike+International+Airport"}]}],N=[{nights:"Night 1",dates:"Wed 12 → Thu 13 Aug",loc:"Negombo",hotel:"Regal Réseau Hotel & Spa",ref:"6153665954",checkin:"12 Aug, 14:00",checkout:"13 Aug, 12:00",price:"$67.09 total",pppn:"$33.55pp",cancel:"Free cancellation until 9 Aug 23:59",addr:"No.06, Carron Place, Negombo",status:"confirmed",dup:!1},{nights:"Nights 2–3",dates:"Thu 13 → Sat 15 Aug",loc:"Kandy",hotel:"Queen's Hotel Kandy — 160 Years of Heritage",ref:"951769301010294749",checkin:"13 Aug, 14:00",checkout:"15 Aug, 12:00",price:"$97.91 total",pppn:"$24.48pp/night",cancel:"Free cancellation until 7 Aug 23:59 (€97 fee after)",addr:"No 4, Dalada Veediya, Kandy — steps from the Temple of Tooth",status:"confirmed",dup:!1},{nights:"Night 4",dates:"Sat 15 → Sun 16 Aug",loc:"Ella",hotel:"Golden View Guest Ella",ref:"",checkin:"15 Aug, 13:00",checkout:"16 Aug, 11:00",price:"$59.49 total (1 night)",pppn:"$29.75pp",cancel:"⚠️ Free-cancellation window closed 13 Aug — contact them directly to confirm you're only using 1 of the 3 booked nights",addr:"Kithalella, Ella, Sri Lanka",status:"confirmed",dup:!1},{nights:"Nights 5–6",dates:"Sun 16 → Tue 18 Aug",loc:"Ella",hotel:"Madushanka Resort",ref:"",checkin:"16 Aug, 12:00",checkout:"18 Aug, 11:00",price:"$158.96 total (2 nights)",pppn:"$39.74pp/night",cancel:"Free cancellation anytime",addr:"Wamullahena, Ella, Sri Lanka",status:"confirmed",dup:!1},{nights:"Nights 7–8",dates:"Tue 18 → Thu 20 Aug",loc:"Passekudah",hotel:"Amethyst Resort Passikudah",ref:"5822537208",checkin:"18 Aug, 14:00",checkout:"20 Aug, 12:00",price:"$427.33 total",pppn:"$106.83pp/night",cancel:"Free cancellation until 14 Aug 23:59",addr:"Coconut Board Road, Pasikuda",status:"confirmed",dup:!1},{nights:"Nights 9–10",dates:"Thu 20 → Sat 22 Aug",loc:"Nilaveli",hotel:"Vitamin Sea Beach Cabana",ref:"5218597388",checkin:"20 Aug, 15:00",checkout:"22 Aug, 11:00",price:"$259.74 total",pppn:"$64.94pp/night",cancel:"⚠️ Free cancellation until 5 Aug 23:59 — check if still within window",addr:"8th mile post, Veluoor, Nilaveli",status:"confirmed",dup:!1},{nights:"Nights 11–13",dates:"Sat 22 → Tue 25 Aug",loc:"Habarana",hotel:"Cinnamon Lodge Habarana",ref:"6090317937",checkin:"22 Aug, 14:00",checkout:"25 Aug, 12:00",price:"$383.47 total",pppn:"$63.91pp/night",cancel:"Free cancellation until 14 Aug 23:59",addr:"Habarana, 50150 Sigiriya",status:"confirmed",dup:!1},{nights:"Nights 14–15",dates:"Tue 25 → Thu 27 Aug",loc:"Kandy",hotel:"Lotus Lake Residence",ref:"6270832909",checkin:"25 Aug, 14:00",checkout:"27 Aug, 11:00",price:"$134.56 total",pppn:"$33.64pp/night",cancel:"Free cancellation until 17 Aug 23:59",addr:"39/2 Rajapihilla Mawatha, Kandy",status:"confirmed",dup:!1}],C=[{item:"Return flights, LHR–CMB (2 people)",cat:"Flights",pp:"£877.00pp · £1,753.99 total",note:"Air India / SriLankan Airlines via Delhi, both ways. Confirmed booking total."},{item:"All 8 confirmed hotels (15 nights, 2 sharing)",cat:"Accommodation",pp:"£1,175.53 total",note:"Room cost already covers both of you — no need to double. See Stays tab for the night-by-night breakdown. Night 4 at Golden View, Nights 5–6 at Madushanka (resolved 14 Aug)."},{item:"Local meals — rice & curry, hoppers, kottu",cat:"Food",pp:"~£12–15pp/day",note:"Breakfast often included at hotels. Lunch + dinner at local spots — good, hearty, unfussy."},{item:"Occasional nicer dinner (seafood, resort restaurant)",cat:"Food",pp:"~£8–12pp extra, ~5 times",note:"Beachfront dinners at Passekudah/Nilaveli, a treat night in Kandy — still casual, not fine dining."},{item:"Drinks & snacks (tea, king coconut, water)",cat:"Food",pp:"~£3–5pp/day",note:"Bottled water essential. King coconut ~£0.70 each, roadside snacks add up fast in a good way."},{item:"Sigiriya Rock Fortress",cat:"Heritage",pp:"£26.00",note:"Includes museum. Book online at ccf.gov.lk. Cash at gate."},{item:"Pidurangala Rock",cat:"Heritage",pp:"~£1.50",note:"Same panorama as Sigiriya, 95% fewer people."},{item:"Dambulla Cave Temples",cat:"Heritage",pp:"~£7.50",note:"LKR ~3,000. Go at 8am before tour groups."},{item:"Polonnaruwa Ancient City",cat:"Heritage",pp:"£18.50",note:"Bicycle rental +£1.50 at gate. Morning only."},{item:"Anuradhapura Sacred City",cat:"Heritage",pp:"£18.50",note:"Some sub-sites have small extra fees."},{item:"Mihintale",cat:"Heritage",pp:"~£2.20",note:"LKR ~900. Birthplace of Buddhism in Sri Lanka."},{item:"Temple of Tooth, Kandy",cat:"Heritage",pp:"~£4.80",note:"LKR 2,000 per person. Camera permit extra."},{item:"Peradeniya Botanical Gardens",cat:"Heritage",pp:"~£9.00",note:"LKR 3,540. Allow 2–3hrs."},{item:"Aluvihara Rock Temple",cat:"Heritage",pp:"~£4.80",note:"LKR ~2,000. Worth every cent — unique site."},{item:"Minneriya Safari (entry + jeep)",cat:"Wildlife",pp:"~£44.00",note:"Entry ~£22 + shared jeep £22. Cash only. Jeep max 6 people."},{item:"Pigeon Island Marine NP + boat",cat:"Wildlife",pp:"~£22.00",note:"Park entry + return boat ride included. Boats 8am–3pm only."},{item:"Whale watching, Trincomalee",cat:"Wildlife",pp:"~£30.00",note:"3–4hr trip. Depart 6–7am. Book via hotel night before."},{item:"Ella Rock guide",cat:"Activities",pp:"~£9–11",note:"Strongly recommended — trail junction fools everyone."},{item:"Esala Perahera viewing stand",cat:"Activities",pp:"~£18–37",note:"Book via kandyperaherabookings.com NOW. Aug 26 = Randoli night."},{item:"Nuwara Eliya day stop",cat:"Activities",pp:"Free–£4",note:"Gregory Lake walk free. Heritage tea factory tours ~£4."},{item:"Airport → Negombo (Day 1)",cat:"Transport",pp:"~£4.50",note:"£9 total. Driver waits in arrivals hall."},{item:"Negombo → Kandy (Day 2)",cat:"Transport",pp:"~£20.00",note:"£41 total split 2 pax. ~3.5hrs."},{item:"Kandy → Nanu Oya (Day 4)",cat:"Transport",pp:"~£16.00",note:"£33 total. Road via Nuwara Eliya. ~2.5hrs."},{item:"Train Nanu Oya → Ella (Day 4)",cat:"Transport",pp:"~£9–13",note:"2nd class reserved recommended. Book eRail.lk."},{item:"Ella → Passekudah (Day 7)",cat:"Transport",pp:"~£26.00",note:"£52 total. ~4hrs scenic drive."},{item:"Passekudah → Nilaveli (Day 9)",cat:"Transport",pp:"~£15.00",note:"£30 total. ~1.5hrs north."},{item:"Nilaveli → Habarana (Day 11)",cat:"Transport",pp:"~£18.50",note:"£37 total. ~2.5hrs."},{item:"Habarana → Kandy via Anuradhapura (Day 14)",cat:"Transport",pp:"~£41.00",note:"Full day driver. ~£81 total for the day."},{item:"Kandy → CMB Airport (Day 16)",cat:"Transport",pp:"~£20.00",note:"£41 total. Depart Kandy by 8am for 14:10 flight."},{item:"Tuk-tuk / PickMe daily",cat:"Transport",pp:"~£7–11/day",note:"Use PickMe app for fair metered prices."},{item:"Fort Frederick, Trincomalee",cat:"Free",pp:"Free",note:"Open 6am–6pm. Deer roam freely inside."},{item:"Koneswaram Temple",cat:"Free",pp:"Free (donation)",note:"One of Sri Lanka's holiest Hindu temples."},{item:"Nine Arch Bridge",cat:"Free",pp:"Free",note:"Best at golden hour (5:30–6:30pm)."},{item:"Little Adam's Peak",cat:"Free",pp:"Free",note:"Open all day. Easy 2hr hike."},{item:"Ravana Falls",cat:"Free",pp:"Free",note:"6km from Ella. Open all day."},{item:"Kanniya Hot Springs",cat:"Free",pp:"Free",note:"Ancient freshwater wells. Open 6am–6pm."},{item:"Udawatta Kele Forest",cat:"Free",pp:"Free",note:"Forest walk above Kandy. Dawn–dusk."},{item:"Bahirawakanda Buddha",cat:"Free",pp:"Free",note:"30min walk up from Kandy Lake."}],E={Flights:"#8B85D9",Accommodation:"#39A883",Food:"#D34C86",Heritage:"#7C3AED",Wildlife:"#059669",Activities:"#E07B39",Transport:"#0A7EA4",Free:"#6B7280"},A=[{region:"Negombo & Colombo",color:"#7C3AED",icon:"🦐",items:[{name:"Hoppers (Appa)",desc:"Bowl-shaped fermented rice pancakes — crispy lace edges, soft steamed centre. Eaten with coconut sambol and lunu miris (onion chilli paste). The breakfast of Sri Lanka."},{name:"Egg Hoppers",desc:"An egg cracked into the hopper while cooking — runny yolk, crispy rice bowl. The most perfect portable breakfast ever conceived."},{name:"Lamprais",desc:"A Dutch-Sri Lankan hybrid: spiced rice, curries and frikkadels baked in a sealed banana leaf parcel. Only in Colombo. Colonial history on a plate."},{name:"Kottu Roti",desc:"Chopped flatbread stir-fried with vegetables, egg, and curry on a screaming-hot iron griddle. The rhythmic metal-on-metal chopping sound is the heartbeat of Sri Lankan night streets."},{name:"Woodapple Juice",desc:"Bizarre, ancient, delicious. Scraped from a hard jungle fruit, mixed with water and jaggery. Tastes like tamarind met rum at a health spa. Try it once — you'll order it again."}]},{region:"Kandy & Hill Country",color:"#1B6B4A",icon:"🍛",items:[{name:"Rice & Curry (full spread)",desc:"The national dish. A mound of rice surrounded by 5–8 small bowls: dhal, jackfruit, fish, potato, gotukola sambol, papadom. Order the full spread at least once — it is a ceremony, not just a meal."},{name:"Kiribath (Milk Rice)",desc:"Thick rice cooked in coconut milk, cut into diamond shapes. Eaten on auspicious days with a burnt-chilli sambol called lunu miris. Ask at your hotel on your first morning — often served free."},{name:"Polos (Young Jackfruit Curry)",desc:"Unripe jackfruit cooked in a deep spice paste — the texture and richness are so convincingly meaty that it regularly fools carnivores. One of the great vegetarian dishes of Asia."},{name:"Kandyan Wattalappam",desc:"A dense, dark coconut milk and jaggery steamed pudding. Spiced with cardamom and nutmeg. The dessert of the Kandyan kingdom. You will not find better than from a street stall near the temple."}]},{region:"Ella & Hill Country Tea",color:"#1B6B4A",icon:"🍵",items:[{name:"String Hoppers (Idiyappam)",desc:"Steamed rice-flour noodle nests — delicate, light, eaten with coconut milk and dal for breakfast. Order with pol sambol (scraped fresh coconut with chilli). Delicious."},{name:"Buffalo Curd & Kithul Treacle",desc:"The Ella signature. Thick, tangy buffalo curd topped with dark kithul palm syrup. Best at the roadside Curd Hut. This has improved the days of every traveller who has tried it."},{name:"Fresh Ceylon Tea at Source",desc:'A proper cup of orange pekoe in a family-run factory — tastes nothing like the supermarket version. Ask for "plain tea, no sugar" the way Sri Lankans drink it. Life-changing.'}]},{region:"East Coast (Passekudah & Trinco)",color:"#0A7EA4",icon:"🦀",items:[{name:"Jaffna-Style Crab Curry",desc:"The east coast speciality. Fresh mud crab in a thin, fiery, tamarind-soured coconut curry. The colour is almost black. The heat is serious. The reward is extraordinary. Order 24hrs ahead."},{name:"Fish Ambul Thiyal",desc:"Dried tuna cooked in a sour-spiced goraka (a jungle fruit like dark tamarind) paste. Intensely flavoured, dry, served in small portions. East coast fishing villages make this better than anywhere."},{name:"Muslim Biryani (Trinco)",desc:"Trincomalee has a large Tamil Muslim community whose biryani — short-grain rice, whole spices, tender chicken or mutton — is extraordinary. Find it near the harbour or ask your hotel to direct you."},{name:"Pol Sambol",desc:"Freshly grated coconut with red chilli, lime, and Maldive fish. Goes with everything. Eaten at every meal by locals. At its best with fresh-caught grilled fish on the beach at sunset."},{name:"King Coconut (Thambili)",desc:"The orange coconut. Ice-cold. Drunk straight from the fruit with a straw. Contains natural electrolytes. After a hot hike or a beach afternoon, this is the greatest thing you will drink all trip."}]},{region:"Cultural Triangle (Habarana area)",color:"#B8680A",icon:"🏺",items:[{name:"Gotukola Sambol",desc:"Raw pennywort leaves (an Ayurvedic herb) mixed with grated coconut, lime, and chilli. Eaten as a salad alongside rice and curry. Cooling, green, medicinal, delicious. Order it everywhere."},{name:"Pumpkin & Coconut Curry",desc:'Temple town cooking: pumpkin simmered in coconut milk with mustard seeds and curry leaves. Simple, deeply comforting. Found at roadside "rice and curry" places near all the ancient sites.'},{name:"Kade Short Eats (Snacks)",desc:"Village bakery staples: fish patties, vegetable rolls, egg roti. Order 3–4 from a roadside kade (bakery shop) for about $1.50. Perfect Cultural Triangle fuel between ruins."},{name:"Treacle Toffee",desc:"Handmade kithul-palm toffee sold near temple towns. Sticky, intense, slightly smoky from the palm sap. Buy a bag — it survives the flight home and makes the best possible souvenir."}]}],j=[{icon:"🛂",title:"Visa / ETA",hl:!0,danger:!1,items:["Most nationalities (US, UK, AU, EU — 40 countries): Free 30-day tourist ETA",'<a href="https://eta.gov.lk/" target="_blank">Apply ONLY at eta.gov.lk</a> — avoid third-party sites charging unnecessary fees',"Passport valid 6+ months from arrival date (12 Aug). Check now.","Print your ETA approval email and carry it at all times in Sri Lanka","Overstaying: fines, possible detention, and future entry bans"]},{icon:"⚠️",title:"2026 Train Warning",hl:!1,danger:!0,items:["Kandy–Nanu Oya rail section SUSPENDED since Cyclone Ditwah (Nov 2025)","Drive from Kandy to Nanu Oya (2.5hrs), then board train to Ella","The Nanu Oya–Ella stretch resumed June 20, 2026 — still scenic!",'Book 2nd class reserved seats at <a href="https://eservices.railway.gov.lk" target="_blank">eservices.railway.gov.lk</a>',"Full Kandy–Ella reopening target: early 2027 (unconfirmed)"]},{icon:"🎆",title:"Perahera 2026 Dates",hl:!0,danger:!1,items:["Kumbal Perahera (5 opening nights): Aug 18–22","Randoli Perahera (5 grand finale nights): Aug 23–26","YOU attend: Aug 26 — penultimate Randoli night, most spectacular","Water-cutting ceremony: Aug 27 early morning (not public)","Day Perahera (final parade): Aug 27 afternoon ~2–4pm",'<a href="https://kandyesalaperahera.com/dates2026/" target="_blank">Official schedule: kandyesalaperahera.com</a>',"<b>Book viewing stand seats NOW</b> — Aug 26 will sell out"]},{icon:"💉",title:"Vaccinations",hl:!1,danger:!1,items:["Hepatitis A — recommended for all travellers (food & water)","Typhoid — recommended (food & water borne)","Tetanus/Diphtheria/Pertussis — update if needed","Hepatitis B — consider for extended rural stays","Yellow fever: ONLY if arriving from an endemic country","See GP or travel clinic at least 6 weeks before 12 August"]},{icon:"🦟",title:"Health on the Ground",hl:!1,danger:!1,items:["Dengue: real risk — use DEET repellent at dawn and dusk without fail","Drink ONLY bottled or purified water. Non-negotiable.","No malaria prophylaxis needed on this specific route","Heat risk at open sites (Sigiriya, Polonnaruwa): visit before 9:30am","Emergency: Police 119 · Ambulance 110 · Tourist Hotline 1912","Get travel insurance with medical evacuation cover"]},{icon:"💵",title:"Money & Cash",hl:!0,danger:!1,items:["Currency: Sri Lankan Rupee (LKR). Verify rate before you go.","CRITICAL: All national parks and heritage sites = cash (LKR) only","Prices quoted in USD but paid in LKR at the day's rate","ATMs: available in cities but NOT near all heritage sites","Crisp USD 100 notes get best rates; worn notes sometimes refused","Best exchange: commercial banks in Kandy or Colombo (not airport)"]},{icon:"📱",title:"Essential Apps",hl:!1,danger:!1,items:['<a href="https://www.pickme.lk/" target="_blank">PickMe</a> — Sri Lanka\'s Uber. Download before you fly.','<a href="https://eservices.railway.gov.lk/" target="_blank">eRail.lk</a> — book Nanu Oya → Ella train tickets',"Maps.me — download offline Sri Lanka map for rural areas","XE Currency — real-time LKR rate converter",'<a href="https://www.kandyperaherabookings.com/" target="_blank">kandyperaherabookings.com</a> — book Perahera viewing stand seats']},{icon:"🛕",title:"Culture & Laws",hl:!1,danger:!1,items:["Cover shoulders AND knees at ALL temples — always. Carry a sarong.","Remove shoes at every Buddhist and Hindu site","No alcohol on Poya (full moon) days — next one: check calendar","Never sit with your back to a Buddha statue for photos","Same-sex relationships criminalised under Sri Lankan law — be discreet","No photography of military or police installations","Drug offences carry severe penalties including long imprisonment"]},{icon:"🧳",title:"Pack for August",hl:!1,danger:!1,items:["Lightweight breathable linen or bamboo clothing","Packable rain poncho — brief showers in hill country are beautiful","Sarong — temple modesty + beach + blanket on the train","Reef-safe SPF 50+ sunscreen — critical at open archaeological sites","DEET mosquito repellent — every evening without fail","Comfortable broken-in walking shoes — DO NOT buy new for this trip","Rehydration sachets and basic first-aid kit","Portable power bank — charging points scarce at heritage sites"]}],z={1:{h:"Regal Réseau Hotel & Spa",loc:"Negombo",addr:"No.06, Carron Place, Negombo, Sri Lanka",dup:!1},2:{h:"Queen's Hotel Kandy",loc:"Kandy",addr:"No 4, Dalada Veediya, Kandy, Sri Lanka",dup:!1},3:{h:"Queen's Hotel Kandy",loc:"Kandy",addr:"No 4, Dalada Veediya, Kandy, Sri Lanka",dup:!1},4:{h:"Golden View Guest Ella",loc:"Ella",addr:"Kithalella, Ella, Sri Lanka",dup:!1},5:{h:"Madushanka Resort",loc:"Ella",addr:"Wamullahena, Ella, Sri Lanka",dup:!1},6:{h:"Madushanka Resort",loc:"Ella",addr:"Wamullahena, Ella, Sri Lanka",dup:!1},7:{h:"Amethyst Resort Passikudah",loc:"Passekudah",addr:"Coconut Board Road, Pasikuda, Sri Lanka",dup:!1},8:{h:"Amethyst Resort Passikudah",loc:"Passekudah",addr:"Coconut Board Road, Pasikuda, Sri Lanka",dup:!1},9:{h:"Vitamin Sea Beach Cabana",loc:"Nilaveli",addr:"8th mile post, Veluoor, Nilaveli, Sri Lanka",dup:!1},10:{h:"Vitamin Sea Beach Cabana",loc:"Nilaveli",addr:"8th mile post, Veluoor, Nilaveli, Sri Lanka",dup:!1},11:{h:"Cinnamon Lodge Habarana",loc:"Habarana",addr:"Habarana, 50150 Sigiriya, Sri Lanka",dup:!1},12:{h:"Cinnamon Lodge Habarana",loc:"Habarana",addr:"Habarana, 50150 Sigiriya, Sri Lanka",dup:!1},13:{h:"Cinnamon Lodge Habarana",loc:"Habarana",addr:"Habarana, 50150 Sigiriya, Sri Lanka",dup:!1},14:{h:"Lotus Lake Residence",loc:"Kandy",addr:"39/2 Rajapihilla Mawatha, Kandy, Sri Lanka",dup:!1},15:{h:"Lotus Lake Residence",loc:"Kandy",addr:"39/2 Rajapihilla Mawatha, Kandy, Sri Lanka",dup:!1},16:{h:"— Flight departs 14:10, no night —",loc:"",dup:!1}},M={1:{direction:"outbound",title:"Flight to Sri Lanka",subtitle:"Departs the night before — Tue 11 Aug",legs:[{flightNo:"AI 2016",airline:"Air India",aircraft:"Airbus A350",from:{code:"LHR",name:"Heathrow Airport",time:"21:45",date:"Tue 11 Aug"},to:{code:"DEL",name:"Indira Gandhi Intl",time:"12:55",date:"Wed 12 Aug"},bags:"1 piece checked"},{flightNo:"AI 6212",airline:"Air India (operated by SriLankan Airlines)",aircraft:"Airbus A320",from:{code:"DEL",name:"Indira Gandhi Intl",time:"18:45",date:"Wed 12 Aug"},to:{code:"CMB",name:"Bandaranaike Intl",time:"22:20",date:"Wed 12 Aug"},bags:"1 piece checked"}],layover:{airport:"Delhi (DEL)",duration:"5h 50m"},totalDuration:"20h 05m"},16:{direction:"inbound",title:"Flight Home",subtitle:"Lands Friday morning — 28 Aug",legs:[{flightNo:"AI 6211",airline:"Air India (operated by SriLankan Airlines)",aircraft:"Airbus A320",from:{code:"CMB",name:"Bandaranaike Intl",time:"14:10",date:"Thu 27 Aug"},to:{code:"DEL",name:"Indira Gandhi Intl",time:"17:45",date:"Thu 27 Aug"},bags:"1 piece checked"},{flightNo:"AI 161",airline:"Air India",aircraft:"Airbus A350",from:{code:"DEL",name:"Indira Gandhi Intl",time:"00:55",date:"Fri 28 Aug"},to:{code:"LHR",name:"Heathrow Airport",time:"07:30",date:"Fri 28 Aug"},bags:"1 piece checked"}],layover:{airport:"Delhi (DEL)",duration:"7h 10m"},totalDuration:"21h 50m"}},B=[{region:"Kandy",color:"#39A883",icon:"🧵",items:[{name:"Handloom textiles",desc:"Genuine hand-woven sarongs, scarves and table runners from villages around Kandy — feel the weave, machine-made will feel too uniform."},{name:'Kandyan lacquerware ("Laksha")',desc:"An ancient craft — wooden objects hand-lacquered in vivid red, black and yellow using sap from the lac tree. Small boxes and ornaments are easy to pack."},{name:"Batik",desc:"Wax-and-dye wall hangings and clothing. Some workshops near Kandy let you watch or even try the process yourself."},{name:"Real spices — Kandy Central Market",desc:'Skip the "spice garden" tours near Matale — they\'re commission-driven and overpriced. The Central Market has the real thing at real prices: cinnamon, cardamom, cloves.'}]},{region:"Ella & Hill Country",color:"#39A883",icon:"🍃",items:[{name:"Ceylon tea, straight from source",desc:"Look for the Lion Logo — it guarantees 100% pure Ceylon tea packed in Sri Lanka. Buy loose leaf from a small family factory rather than a supermarket brand."},{name:"Fair-trade handmade jewellery",desc:"Ella's main street has several small fair-trade shops selling direct-from-artisan pieces — genuinely different from the mass-produced stalls."},{name:"Local honey & kithul treacle",desc:"A real hill-country product, and doubles as a delicious edible souvenir. The same treacle you had on your curd."},{name:"Hand-knitted woollens",desc:"The cool hill climate supports a genuine cottage knitting trade — look for women's cooperative stalls rather than shop-front tourist stock."}]},{region:"East Coast (Passekudah, Nilaveli, Trincomalee)",color:"#22ABC7",icon:"🐚",items:[{name:"Honest note",desc:"This stretch of the trip is about beaches and wildlife, not shopping — don't feel you need to force a purchase here."},{name:"Coconut shell crafts",desc:"Genuinely eco-friendly and widespread in coastal communities — carved bowls, spoons and jewellery, light enough to not dent your luggage weight."}]},{region:"Cultural Triangle (Habarana, Sigiriya, Dambulla)",color:"#DC9433",icon:"🪵",items:[{name:"Honest note",desc:"Same as the east coast — the ancient sites are the draw here, not the shopping. A few small stalls exist, worth a glance, not a destination."},{name:"Small wood carvings",desc:"Local stalls near Dambulla and Sigiriya sell hand-carved pieces — nothing fancy, but genuinely made by the person selling them."}]},{region:"Colombo / Negombo (final day)",color:"#8B85D9",icon:"🛍️",items:[{name:"Laksala",desc:"Government-run handicraft store, multiple branches. Fixed, fair prices and guaranteed authentic — the safe option if you're catching up on gifts on your last day."},{name:"Barefoot, Colombo",desc:"Contemporary Sri Lankan handloom fashion and homeware — ethically made, genuinely well-regarded, not mass-produced."},{name:"Selyn Fair Trade",desc:"Sri Lanka's only fair-trade certified handloom company. Branches in Colombo and Kandy."},{name:"Pettah Market — cinnamon specifically",desc:'Sri Lanka produces 90% of the world\'s "true cinnamon." Real prices, real product, chaotic but authentic — much better value than any airport shop.'}]}],D=["Lion Logo on tea packaging = genuine 100% Ceylon tea. No logo, no guarantee.",'Gems: ONLY buy from dealers registered with the National Gem and Jewellery Authority (NGJA), and always ask for a certificate. A stranger or tuk-tuk driver offering an "amazing deal" on sapphires is the single most common tourist scam in Sri Lanka — treat it as a hard no.',"Laksala (government-run) is a reliable fallback anywhere on the island — fixed prices, guaranteed authentic, no haggling needed.","Haggling is expected and fine at markets and small stalls. Not at fixed-price government stores like Laksala — the price on the tag is the price.","Avoid coral, turtle-shell, or ivory items — they're illegal to export and the trade harms real ecosystems."],O={1:[["22:20","Land CMB — Bandaranaike International Airport"],["~23:00","Clear immigration + collect bags (~40min)"],["23:10","Meet driver in Arrivals, depart for Negombo (10min)"],["23:25","Check in — Regal Réseau Hotel & Spa"],["23:45","Lights out — long day tomorrow"]],2:[["07:30","Wake, breakfast at hotel"],["08:30","Check out Negombo, depart for Kandy"],["08:30–1  (~20min)"],["8:00","Arrive Trinco Bay Dive Center"],["8:00–8:30","Check-in, gear fitting"],["8:30","Safety briefing"],["9:00","Boat departs"],["9:00–12:00","Snorkeling trip — Pigeon Island"],["12:00–12:45","Lunch in Uppuveli"],["12:45–13:15","Browse Fernando's Beach Market"],["13:15–13:35","Drive to Nilaveli"],["13:35","Check in at Vitamin Sea, beach afternoon"],["Evening","Sunset on Nilaveli Beach, early dinner"]],10:[["7:00","White Rock snorkel trip departs"],["7:00–9:30","Snorkeling — White Rock, reef near Pigeon Island"],["9:30–10:00","Back, breakfast"],["10:45–11:10","Drive to Trincomalee / Fort Frederick"],["11:10–12:30","Fort Frederick + Koneswaram Temple — before peak heat"],["12:30–1:00","Drive back to Nilaveli"],["1:00–2:00","Lunch"],["2:00–4:00","Rest through the hottest part of the day"],["4:00–4:30","Depart for crocodile lagoon"],["4:30–6:30","Wild crocodile lagoon boat tour, ending at sunset"],["Evening","Dinner, easy night"]],11:[["07:30","Wake, breakfast, pack"],["08:30","Check out Nilaveli, depart for Habarana"],["08:30–08:55","Drive toward Kantale (~20–25min)"],["08:55–09:20","Kantale Tank — short walk, roadside buffalo curd"],["09:20–11:00","Continue to Habarana (~1h40min)"],["11:00","Arrive, ask for early check-in Cinnamon Lodge"],["12:00","Lunch"],["13:00–15:00","Rest / pool — hottest hours"],["17:00","Habarana Lake walk (elephants sometimes visit)"],["18:30","Dinner"],["19:30","Early night — 7am Sigiriya start tomorrow"]],12:[["05:00","Wake"],["05:15","Depart hotel — private driver, pre-arranged pickup"],["05:15–05:35","Drive to Sigiriya (~20min)"],["05:35–06:00","Ticket at E-Ticket Counter (side building), begin climb before full daylight"],["06:00–08:15","Climb + explore Sigiriya (frescoes, summit) — dawn light, cool air, minimal crowds"],["08:15–08:45","Museum at base"],["09:00","Return to hotel"],["09:30","Late breakfast"],["11:00–15:00","Rest — peak heat, stay indoors/pool"],["15:30","Depart for Aluvihara Rock Temple"],["16:00–16:45","Aluvihara Rock Temple"],["16:45","Depart for Pidurangala (15min)"],["17:00","Start Pidurangala climb (25–30min incl. scramble)"],["17:30","Summit — find your spot, settle in"],["17:30–18:20","Wait for it — dusk colours build, Sigiriya’s silhouette darkens"],["~18:20","Sunset moment"],["18:20–18:45","Stay for the afterglow, then start down while there’s still some light"],["19:00","Descend, torches on"],["20:00","Dinner"]],13:[["06:30","Wake, breakfast (hotel opens 6:30)"],["07:00","Depart for Dambulla (~30min)"],["07:30","Arrive — buy ticket at the correct entrance before climbing"],["07:30–07:50","Climb — ~364 steps, 10–20min, socks on"],["07:50–09:30","Caves 2 and 3 priority, Cave 1 for the gold-elbow detail, skip 4–5 if short on time"],["09:30–09:45","Golden Temple + golden Buddha statue on the way down"],["09:45–10:15","Return to Habarana"],["10:15–13:15","Rest, lunch, pool"],["13:30","Private jeep pickup (hotel-booked)"],["13:30–14:10","Drive to Kaudulla (~40min)"],["14:10–17:45","Safari — ~3.5hrs"],["17:45–18:00","Head to the exit — park closes 6pm"],["18:00–18:40","Return drive to Habarana"],["19:00","Dinner"]],14:[["06:00","Wake, quick breakfast"],["06:30","Depart Habarana for Polonnaruwa"],["07:15","Arrive Polonnaruwa, rent bicycle"],["07:15–10:15","Cycle the ruins (Gal Vihara etc.)"],["10:15","Depart for Anuradhapura (1.5hrs)"],["11:45–14:15","Anuradhapura — Sri Maha Bodhi, Ruwanwelisaya + lunch"],["14:30","Depart for Mihintale (20min)"],["14:50–16:20","Mihintale — 1,840 steps, hilltop dagobas"],["16:30","Depart for Kandy (3.5hrs)"],["20:00","Arrive Kandy, check in Lotus Lake Residence"],["20:30","Late dinner"]],15:[["07:00","Wake"],["07:15","Depart Kandy for Ambuluwawa Tower"],["08:15–10:30","Climb Ambuluwawa Tower — before the heat/crowd cutoff"],["10:30–11:30","Drive back to Kandy"],["11:30","Breakfast/brunch"],["12:00–14:00","Shopping — crafts, tea, batik, gems"],["14:00","Lunch"],["14:30–17:00","Rest, pack for early departure tomorrow"],["17:00","Get dressed, light early dinner"],["19:00","Walk/tuk-tuk to viewing stand"],["19:30","Seated — arrive before the crowds"],["20:00–22:30","RANDOLI PERAHERA procession"],["22:30","Walk back to hotel"],["23:00","Sleep — very early start tomorrow (5:45am)"]],16:[["05:15","Wake — early!"],["05:45","Depart Kandy — no puja this time, straight to Pinnawala"],["05:45–07:15","Drive to Pinnawala (~1–1.5hrs)"],["07:15–08:00","Wait for gates to open (~8am)"],["08:00","Gates open, enter"],["08:00–09:15","Explore grounds, position for the feeding"],["09:15–10:00","Morning feeding session"],["10:00","HARD departure — leave regardless of what's happening"],["10:00–12:45","Drive to CMB Airport (~2.5–3hrs)"],["12:45–14:10","Check-in, security, boarding (~1h25min buffer)"],["14:10","Departure"]]},R={1:"👕 Comfortable travel clothes for the flight. Light layer for aircon. Sandals fine — you're going straight to bed.",2:"🛕 Temple visit tonight: shoulders + knees covered, closed-toe shoes easiest to remove/re-wear at the temple. Light layers — evenings run 20–22°C. Carry a sarong.",3:"🥾 Comfortable walking shoes (gardens + forest). Breathable clothes, sun hat. Modest wear for the 6:30am temple visit. Small rain layer — 42% rain today.",4:"🧥 LAYER UP — hill country mornings are cool (18°C). Light jacket or fleece for Nuwara Eliya. Train windows are open — wind + occasional soot, wear something you don't mind getting a bit dusty. Swap to lighter clothes on arrival in warmer Ella.",5:"🥾 Hiking shoes or trainers with grip. Shorts/light hiking pants + moisture-wicking top. Sun hat + SPF. Light rain jacket (45% chance). No swimsuit needed today.",6:"🥾 PROPER hiking shoes essential — the Ella Rock trail is unmarked and can be slippery. Quick-dry shirt, cap, 1.5L water in a day pack. Light rain shell.",7:"👙 SWIMSUIT DAY — pack it on top of your bag, you'll want it within the hour of arriving. Light cotton clothes for the drive, sandals, sun hat, reef-safe sunscreen. Cover-up for lunch.",8:"👙 Swimsuit + r
