lat:7.209,lng:79.838,min:24,max:30,rain:35,icon:"🌤",desc:"Warm coastal evening",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Negombo_Beach,_Sri_Lanka.jpg?width=900",hours:[],warn:"You land at 22:20. After immigration (~45min) and bags (~20min), you'll clear by 23:30. Negombo is 10 min from the airport. Drive straight there — do NOT attempt Kandy tonight (3.5hrs+).",acts:[{i:"✈️",t:"Land CMB 22:20 · immigration + bags ~45–60 min"},{i:"🚗",t:"Transfer to Negombo — 10 min from airport, your driver meets you at Arrivals"},{i:"🌙",t:"Check in, quick shower, bed. Tomorrow begins properly. You have arrived."}],gem:null,highlight:null,transport:"🚗 Airport transfer to Negombo — ~$12 total (10 min)",links:[{l:"📍 Negombo",u:"https://maps.google.com/?q=Negombo+Sri+Lanka"}]},{id:2,date:"Thu 13 Aug",region:"hills",title:"Negombo → Kandy",loc:"Negombo → Kandy",lat:7.291,lng:80.634,min:22,max:29,rain:38,icon:"⛅",desc:"Partly cloudy, mild",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Zahntempel_Kandy.jpg?width=900",hours:[{t:"Temple of Tooth: 6:30am–8pm (pujas 6:30am, 9:30am, 6:30pm)",ok:!0}],warn:null,acts:[{i:"🌅",t:"Leisurely Negombo breakfast — try hoppers at a beach café"},{i:"🚗",t:"Private driver to Kandy — 3.5hrs through spice country",u:"https://maps.google.com/?q=Kandy+Sri+Lanka"},{i:"🌊",t:"Kandy Lake walk on arrival — gorgeous at dusk with the temple reflected"},{i:"🛕",t:"Evening puja at Temple of the Tooth (6:30pm) — drums, incense, candlelight",u:"https://www.maligawa.lk/"},{i:"🍛",t:"Dinner: rice & curry at a local spot on Dalada Veediya — order the dhal and jackfruit curries"}],gem:"The 6:30pm puja is the most atmospheric of the three daily ceremonies — the priests carry the gold reliquary casket as drummers pound in the courtyard. Far more intimate than daytime visits.",highlight:null,transport:"🚗 Private Driver Negombo → Kandy — ~$55 total (~3.5hrs)",links:[{l:"🛕 Temple of Tooth",u:"https://www.maligawa.lk/"},{l:"📍 Kandy Lake",u:"https://maps.google.com/?q=Kandy+Lake+Sri+Lanka"}]},{id:3,date:"Fri 14 Aug",region:"hills",title:"Kandy: Temples, Gardens & Hidden Forest",loc:"Kandy",lat:7.291,lng:80.634,min:20,max:28,rain:42,icon:"🌦",desc:"Morning cloud, sunny spells",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Temple_of_the_Tooth,_Sitting_Buddha_statues.-_Kandy.jpg?width=900",hours:[{t:"Temple of Tooth: 6:30am puja (start early!)",ok:!0},{t:"Peradeniya Gardens: 7:30am–5:30pm daily",ok:!0},{t:"Udawatta Kele: 6am–6pm daily (free)",ok:!0}],warn:null,acts:[{i:"🛕",t:"Temple of Tooth — 6:30am morning puja · spine-tingling drumming ceremony",u:"https://www.maligawa.lk/"},{i:"🌿",t:"Peradeniya Botanical Gardens — Asia's finest: royal palm avenue, giant bat colony, orchid house",u:"https://www.botanicgardens.gov.lk/"},{i:"🌳",t:"Udawatta Kele forest sanctuary — free, misty, howling monkeys, no tourists",u:"https://maps.google.com/?q=Udawatta+Kele+Sanctuary+Kandy"},{i:"🗻",t:"Bahirawakanda hilltop white Buddha — free 30min walk, best panorama of Kandy Lake"},{i:"🎨",t:"Evening: Arts & Crafts Centre on Sangaraja Mawatha — batik, lacquerware, silver"}],gem:"Udawatta Kele is the best-kept secret in Kandy. A royal forest reserve literally behind the temple, with monkey troops, meditation caves used by monks for centuries, and bird life most guides never mention. Go alone, go slowly.",highlight:null,transport:"🛺 Tuk-tuk/PickMe within Kandy (~$2–4 per ride)",links:[{l:"🛕 Temple of Tooth",u:"https://www.maligawa.lk/"},{l:"🌿 Peradeniya Gardens",u:"https://www.botanicgardens.gov.lk/"},{l:"📍 Udawatta Kele",u:"https://maps.google.com/?q=Udawatta+Kele+Sanctuary+Kandy"}]},{id:4,date:"Sat 15 Aug",region:"hills",title:"Drive → Nuwara Eliya → Train to Ella",loc:"Kandy → Nuwara Eliya → Nanu Oya → Ella",lat:6.867,lng:81.047,min:18,max:26,rain:45,icon:"🌦",desc:"Misty highlands — this is the magic",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Nine_Arches_Bridge_in_Ella.jpg?width=900",hours:[{t:"Nanu Oya station: board train ~12:00–13:00 (verify at station)",ok:!0},{t:"Train Nanu Oya → Ella: ~3.5–4hrs, arrives late afternoon",ok:!0},{t:"⚠️ Book 2nd class reserved via eRail.lk — 30 days ahead",ok:!1}],warn:"The Kandy–Nanu Oya rail section remains CLOSED (Cyclone Ditwah). Drive from Kandy to Nanu Oya (2.5hrs). Optional 2hr stop in Nuwara Eliya en route. Board train at Nanu Oya for the Ella stretch — still the most scenic section.",acts:[{i:"🚗",t:"Drive Kandy → Nuwara Eliya (2hrs) — window views through tea estates the whole way"},{i:"☕",t:"Nuwara Eliya: colonial hill station — Gregory Lake, Grand Hotel tearoom, old post office",g:"Nuwara Eliya Sri Lanka Lake"},{i:"🚗",t:"Drive Nuwara Eliya → Nanu Oya station (30min)"},{i:"🚂",t:"Train Nanu Oya → Ella (~3.5hrs) — tea estates, waterfalls, cloud forest gorges",u:"https://www.12go.asia/en/train/nanu-oya/ella"},{i:"🌉",t:"Arrive Ella — Nine Arch Bridge at dusk if light allows"}],gem:"The Nanu Oya → Ella stretch is the crown jewel of Sri Lankan rail: the train dives through 46 tunnels, crosses 56 bridges and descends from 1,800m to 1,000m through cloud forest. Sit on the LEFT side facing forward.",highlight:null,transport:"🚗 Car Kandy → Nanu Oya (~$45) · 🚂 Train Nanu Oya → Ella (~$10–15pp)",links:[{l:"🎟 Book Train eRail.lk",u:"https://eservices.railway.gov.lk/"},{l:"🎟 12Go Asia",u:"https://www.12go.asia/en/train/nanu-oya/ella"},{l:"📍 Nine Arch Bridge",u:"https://maps.google.com/?q=Nine+Arch+Bridge+Ella+Sri+Lanka"}]},{id:5,date:"Sun 16 Aug",region:"hills",title:"Ella: Little Adam's Peak & Local Life",loc:"Ella",lat:6.867,lng:81.047,min:16,max:25,rain:45,icon:"⛅",desc:"Mist in mornings, sunny spells",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/SL_Ella_asv2020-01_img25_View_from_Little_Adams_Peak.jpg?width=900",hours:[{t:"Little Adam's Peak: open all day, free. Best before 9am or after 3pm",ok:!0},{t:"Nine Arch Bridge viewpoint: best light 5–6:30pm",ok:!0}],warn:null,acts:[{i:"🥾",t:"Little Adam's Peak — easy 2hr hike through tea estates, staggering valley views",g:"Little Adam's Peak Ella Sri Lanka"},{i:"🍵",t:"Local family tea factory — ask your guesthouse for the family-run one, skip the tourist traps"},{i:"🌉",t:"Nine Arch Bridge at golden hour — different angles, different magic every time"},{i:"🍛",t:"Dinner: egg hoppers + kottu roti at a local spot. Avoid the main tourist strip restaurants."},{i:"🥭",t:"Curd Hut on the main road — buffalo curd with kithul treacle, life-changing"}],gem:"Ask at your guesthouse about Buduruvagala — 9th-century rock-cut Buddhas in the jungle, 20min by tuk-tuk, virtually no other visitors. A genuine hidden site that rivals anything in the Cultural Triangle.",highlight:null,transport:"🛺 Tuk-tuk for local trips (~$2–4)",links:[{l:"📍 Little Adam's Peak",u:"https://maps.google.com/?q=Little+Adam's+Peak+Ella"},{l:"📍 Nine Arch Bridge",u:"https://maps.google.com/?q=Nine+Arch+Bridge+Ella"},{l:"📍 Buduruvagala",u:"https://maps.google.com/?q=Buduruvagala+Sri+Lanka"}]},{id:6,date:"Mon 17 Aug",region:"hills",title:"Ella Rock: The Big Day",loc:"Ella",lat:6.867,lng:81.047,min:16,max:25,rain:50,icon:"🌦",desc:"Cloud & sun — perfect hiking temps",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Heaven_Mountains,_Ella,_Sri_Lanka.jpg?width=900",hours:[{t:"Ella Rock hike: start by 7am, summit by 9:30am before clouds roll in",ok:!0},{t:"Ravana Falls: open all day, free",ok:!0}],warn:null,acts:[{i:"🧗",t:"Ella Rock full hike — 4–5hrs return, 1,041m summit, 360° valley panorama",g:"Ella Rock Hike Sri Lanka"},{i:"🧭",t:"Hire local guide from guesthouse (~$12) — the trail forks deceptively near the railway line"},{i:"💧",t:"Ravana Falls — 6km from town, dramatic plunge waterfall, free entry",g:"Ravana Falls Ella Sri Lanka"},{i:"🥥",t:"Recovery afternoon: King Coconut, hammock, ice-cold Arrack Sour — you earned it"}],gem:"The trail starts along the railway track heading toward Demodara. Follow it until you see a small Buddhist shrine on the left — that is the turn. Without a guide, 8 in 10 people miss it and end up back at the road.",highlight:null,transport:"🛺 Tuk-tuk to trailhead (~$2) · Walk/tuk-tuk to Ravana Falls",links:[{l:"📍 Ella Rock Trail",u:"https://maps.google.com/?q=Ella+Rock+Sri+Lanka"},{l:"📍 Ravana Falls",u:"https://maps.google.com/?q=Ravana+Falls+Ella+Sri+Lanka"}]},{id:7,date:"Tue 18 Aug",region:"coast",title:"East Bound — Passekudah",loc:"Ella → Passekudah",lat:7.917,lng:81.55,min:26,max:33,rain:12,icon:"🌤",desc:"Warming fast — monsoon divide",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Maalu_Maalu_Beach_Resort,_Pasikuda,_Sri_Lanka.jpg?width=900",hours:[{t:"Perahera Night 1 (Kumbal) in Kandy tonight — we'll catch the spectacular finale Aug 26",ok:!1}],warn:null,acts:[{i:"🚗",t:"Private driver Ella → Passekudah — 4hrs through Badulla descent, stunning viewpoints"},{i:"🌊",t:"First swim: crystal-clear, bathtub-warm Passekudah Bay — east coast peak season!"},{i:"🦐",t:"Sunset dinner: grilled fresh prawns on the beach, first cold Arrack Sour of the coast leg"},{i:"🌴",t:"Evening beach walk — barely any other tourists on this stretch"}],gem:"Ask the driver to stop at the Badulla descent viewpoints (~1,400m elevation). The view over the eastern plains, where jungle meets ancient rice paddy in one vast flat canvas, is breathtaking — and takes 3 minutes.",highlight:"🎆 The Esala Perahera begins in Kandy TONIGHT (Aug 18 — Kumbal nights start). We'll catch the spectacular Randoli finale on Aug 26 at the end of the trip. Best of both worlds.",transport:"🚗 Private Driver Ella → Passekudah — ~$70 total (~4hrs)",links:[{l:"📍 Passekudah Bay",u:"https://maps.google.com/?q=Passekudah+Bay+Sri+Lanka"}]},{id:8,date:"Wed 19 Aug",region:"coast",title:"Passekudah: Reef, Snorkel & Village Life",loc:"Passekudah",lat:7.917,lng:81.55,min:26,max:33,rain:10,icon:"☀️",desc:"Gloriously sunny — east coast peak",special:!1,img:"https://picsum.photos/seed/passekudah-snorkel-reef2/900/400",hours:[{t:"Snorkel reef: best 7–11am before wind picks up in afternoon",ok:!0}],warn:null,acts:[{i:"🤿",t:"Snorkel the reef right off the beach — excellent coral just metres from shore, no boat needed"},{i:"🛺",t:"Tuk-tuk to Valaichenai fishing village — Muslim community, zero tourists, warm welcome",g:"Valaichenai Sri Lanka"},{i:"🦀",t:"Arrange crab curry dinner with a local family via your guesthouse — ask specifically for this"},{i:"📖",t:"Pure beach afternoon: books, hammock, silence. The Sri Lanka few tourists ever find."}],gem:"Valaichenai at 4pm: the fishing fleet returns. Dozens of painted wooden boats nose into the harbour, men unload gleaming fish into wicker baskets, kids play in the shallows. Completely real, completely beautiful.",highlight:null,transport:"🛺 Tuk-tuk within Passekudah area (~$3–5)",links:[{l:"📍 Passekudah Beach",u:"https://maps.google.com/?q=Passekudah+Beach+Sri+Lanka"},{l:"📍 Valaichenai",u:"https://maps.google.com/?q=Valaichenai+Sri+Lanka"}]},{id:9,date:"Thu 20 Aug",region:"coast",title:"Pigeon Island + Nilaveli",loc:"Passekudah → Nilaveli",lat:8.581,lng:81.215,min:27,max:34,rain:10,icon:"☀️",desc:"Perfect sunshine — best beach day",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Pigeon_Island_National_Park,_Sri_Lanka.jpg?width=900",hours:[{t:"Pigeon Island NP: 8am–5pm · boats run 8am–3pm only",ok:!0},{t:"Entry + boat: pay at the jetty in Nilaveli. Cash only.",ok:!1}],warn:null,acts:[{i:"🚗",t:"Drive north Passekudah → Nilaveli (~1.5hrs)"},{i:"🐟",t:"Pigeon Island Marine NP — reef sharks, sea turtles, parrotfish, extraordinary coral garden",u:"https://maps.google.com/?q=Pigeon+Island+National+Park+Nilaveli"},{i:"🏝",t:"Nilaveli Beach — wide, pristine, undeveloped. The beach the south coast wishes it was."},{i:"🌅",t:"Sunset over the Indian Ocean — every shade of orange the sky owns"}],gem:"The blacktip reef sharks at Pigeon Island are harmless and plentiful — they patrol the sandy bottom in 2m of water. Stay calm, float still, and they'll come within arm's reach. This is a world-class snorkel site.",highlight:null,transport:"🚗 Private Driver Passekudah → Nilaveli — ~$40 total (~1.5hrs)",links:[{l:"📍 Pigeon Island NP",u:"https://maps.google.com/?q=Pigeon+Island+National+Park+Nilaveli+Sri+Lanka"},{l:"📍 Nilaveli Beach",u:"https://maps.google.com/?q=Nilaveli+Beach+Sri+Lanka"}]},{id:10,date:"Fri 21 Aug",region:"coast",title:"Trincomalee: Whales, Temples & Hot Springs",loc:"Trincomalee",lat:8.567,lng:81.233,min:26,max:33,rain:12,icon:"⛅",desc:"Warm, breezy, mostly sunny",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Koneswaram_Temple_-_Trincomalee.jpg?width=900",hours:[{t:"Fort Frederick: 6am–6pm daily. Free.",ok:!0},{t:"Koneswaram Temple: 6am–8pm daily. Free (donation).",ok:!0},{t:"Whale watching: boats depart 6am–7am. Book via hotel night before.",ok:!0},{t:"Kanniya Hot Springs: 6am–6pm daily. Free.",ok:!0}],warn:null,acts:[{i:"🐋",t:"Blue whale watching boat trip — 3–4hrs, depart 6–7am. Aug is peak season for blue & sperm whales.",g:"Trincomalee whale watching Sri Lanka August"},{i:"🏰",t:"Fort Frederick — British colonial fort, free-roaming deer inside the ramparts",u:"https://maps.google.com/?q=Fort+Frederick+Trincomalee+Sri+Lanka"},{i:"🛕",t:"Koneswaram Temple on Swami Rock — cliff-top Hindu temple, 100m above the ocean",g:"Koneswaram Temple Trincomalee"},{i:"♨️",t:"Kanniya Hot Springs — seven ancient freshwater wells, free, 99% local visitors",g:"Kanniya Hot Springs Trincomalee"}],gem:"Kanniya Hot Springs: seven small wells fed by a single ancient underground source, each at a different temperature. Nothing about this place is flashy. It is completely free, completely local, completely unforgettable.",highlight:null,transport:"🛺 Tuk-tuk/PickMe within Trincomalee (~$3–6)",links:[{l:"📍 Fort Frederick",u:"https://maps.google.com/?q=Fort+Frederick+Trincomalee+Sri+Lanka"},{l:"📍 Koneswaram Temple",u:"https://maps.google.com/?q=Koneswaram+Temple+Trincomalee"},{l:"♨️ Kanniya Hot Springs",u:"https://maps.google.com/?q=Kanniya+Hot+Springs+Trincomalee"}]},{id:11,date:"Sat 22 Aug",region:"triangle",title:"Into the Cultural Triangle — Habarana",loc:"Trincomalee → Habarana",lat:8.003,lng:80.751,min:25,max:35,rain:18,icon:"⛅",desc:"Getting hotter, mostly dry",special:!1,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Habarana_wewa.jpg?width=900",hours:[{t:"Habarana Lake walk: best at dawn (~5:30am) and dusk",ok:!0}],warn:null,acts:[{i:"🚗",t:"Private driver Trincomalee → Habarana — 2.5hrs through dry zone jungle"},{i:"🐘",t:"Habarana Lake at dusk — wild elephants sometimes come to drink (genuinely)"},{i:"🏊",t:"Lodge with a pool: 35°C heat makes this non-negotiable in the Cultural Triangle"},{i:"🌿",t:"Ritigala Strict Nature Reserve nearby — jungle monastery ruins, almost no visitors. Ask lodge for guide."},{i:"🌙",t:"Early night: Sigiriya opens at 7am, you want to be first through the gate tomorrow"}],gem:"Ritigala is an extraordinary secret — dense forest ruins of a forest monastery used by ascetic monks for 2,000 years. The jungle has reclaimed the stone platforms and walkways. Eerie, atmospheric, and all yours.",highlight:null,transport:"🚗 Private Driver Trincomalee → Habarana — ~$50 total (~2.5hrs)",links:[{l:"📍 Habarana",u:"https://maps.google.com/?q=Habarana+Sri+Lanka"},{l:"📍 Ritigala",u:"https://maps.google.com/?q=Ritigala+Strict+Nature+Reserve+Sri+Lanka"}]},{id:12,date:"Sun 23 Aug",region:"triangle",title:"Sigiriya Lion Rock + Pidurangala Sunset",loc:"Sigiriya + Pidurangala",lat:7.957,lng:80.76,min:24,max:36,rain:20,icon:"☀️",desc:"Very hot — 7am entry is essential",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Sigiriya_Rock_fortress.jpg?width=900",hours:[{t:"Sigiriya: Opens 7:00am · Last entry 5:00pm · Closes 5:30pm",ok:!0},{t:"Frescoes area closes 5:45pm · Museum: 8am–5pm",ok:!0},{t:"Pidurangala: Open all day · Best 4:30–6pm for sunset view of Sigiriya",ok:!0},{t:"⚠️ Randoli Perahera begins TONIGHT in Kandy (23–26 Aug)",ok:!1}],warn:null,acts:[{i:"🦁",t:"Sigiriya Lion Rock — arrive at gate at 7am EXACTLY. UNESCO fortress on a 200m granite column.",u:"https://maps.google.com/?q=Sigiriya+Rock+Fortress+Sri+Lanka"},{i:"🎨",t:"Sigiriya Maidens frescoes — 1,500-year-old paintings of celestial women, unique in the world"},{i:"🪞",t:"Mirror Wall — 8th century graffiti carved by ancient visitors. Sri Lanka's oldest social media."},{i:"🌄",t:"Pidurangala Rock at sunset — $2, same view as Sigiriya in reverse, 95% fewer tourists",g:"Pidurangala Rock sunset Sri Lanka"},{i:"🏺",t:"Aluvihara Rock Temple — where Buddhist canon was first written (1st c BC), eerily quiet",g:"Aluvihara Rock Temple Matale Sri Lanka"}],gem:"Pidurangala at sunset is THE photograph. The silhouette of Sigiriya Rock against orange sky, jungle on every horizon. The 20-minute scramble costs $2. I will personally be disappointed if you skip this.",highlight:"🎆 Randoli Perahera grand processions begin in Kandy tonight (Aug 23). We attend Aug 26 — the penultimate finale night, most spectacular of all.",transport:"🚗 Private Driver to Sigiriya (~20min from Habarana) · 🛺 Tuk-tuk to Pidurangala + Aluvihara",links:[{l:"📍 Sigiriya Rock",u:"https://maps.google.com/?q=Sigiriya+Rock+Fortress+Sri+Lanka"},{l:"📍 Pidurangala",u:"https://maps.google.com/?q=Pidurangala+Rock+Sigiriya"},{l:"📍 Aluvihara Temple",u:"https://maps.google.com/?q=Aluvihara+Rock+Temple+Matale"}]},{id:13,date:"Mon 24 Aug",region:"triangle",title:"Dambulla + The Elephant Gathering",loc:"Dambulla → Minneriya",lat:8.03,lng:80.649,min:24,max:35,rain:22,icon:"☀️",desc:"Hot & dry — Minneriya golden hour",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Elephants_of_Minneriya_National_Park,_Sri_Lanka.jpg?width=900",hours:[{t:"Dambulla Cave Temples: 7:00am–6:00pm daily (go at 8am)",ok:!0},{t:"Minneriya NP: safari jeeps depart 3pm–3:30pm · back by 6:30pm",ok:!0},{t:"Minneriya ticket office: 6am–6pm · Cash only",ok:!1}],warn:null,acts:[{i:"🕌",t:"Dambulla Cave Temples — 5 cave sanctuaries, 153 Buddhas, 2,000yr murals. Go at 8am.",u:"https://maps.google.com/?q=Dambulla+Cave+Temple+Sri+Lanka"},{i:"🐘",t:'Minneriya NP — "The Gathering": 200–400 wild elephants converge on the reservoir at dusk',u:"https://maps.google.com/?q=Minneriya+National+Park+Sri+Lanka"},{i:"🌅",t:"Watch elephant families arrive in waves from the jungle — calves, bulls, matriarchs"},{i:"🎙",t:"The sound of hundreds of elephants splashing in the dusk: something you will never forget"}],gem:"The Gathering at Minneriya in August is one of the 10 greatest wildlife spectacles on Earth. If you see 300 elephants and a watering hole full of calves at sunset, there is no photograph that will do justice to how you feel. None.",highlight:null,transport:"🚗 Private Driver to Dambulla (~30min from Habarana) · 🚙 Shared jeep safari Minneriya (~$55)",links:[{l:"🕌 Dambulla Cave Temple",u:"https://maps.google.com/?q=Dambulla+Cave+Temple+Sri+Lanka"},{l:"🐘 Minneriya NP",u:"https://maps.google.com/?q=Minneriya+National+Park+Sri+Lanka"}]},{id:14,date:"Tue 25 Aug",region:"triangle",title:"Polonnaruwa + Anuradhapura + Mihintale",loc:"Polonnaruwa → Anuradhapura → Kandy",lat:8.311,lng:80.404,min:25,max:36,rain:20,icon:"☀️",desc:"Hot & dry — start at 6am",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Ruwanwelisaya.jpg?width=900",hours:[{t:"Polonnaruwa: 7:00am–6:00pm · rent bicycle at gate ($2)",ok:!0},{t:"Anuradhapura: 6:00am–6:00pm · Sri Maha Bodhi open all day",ok:!0},{t:"Mihintale: 6:00am–6:00pm · 1,840 stone steps · Free",ok:!0}],warn:"Long day — 6am start essential. Habarana → Polonnaruwa (45min) → Anuradhapura (1.5hrs) → Mihintale (20min from Anuradhapura) → Kandy (3.5hrs). Arrive Kandy ~8–9pm in time for tomorrow's Perahera.",acts:[{i:"🚲",t:"Polonnaruwa by bicycle — Gal Vihara giant rock Buddhas are unmissable",u:"https://maps.google.com/?q=Polonnaruwa+Ancient+City+Sri+Lanka"},{i:"🌳",t:"Sri Maha Bodhi, Anuradhapura — world's oldest documented tree (planted 288 BC)",g:"Jaya Sri Maha Bodhi Anuradhapura"},{i:"🏯",t:"Ruwanwelisaya + Jetavanaramaya stupas — colossal 2,000-year-old white monuments"},{i:"⛰️",t:"Mihintale — birthplace of Buddhism in Sri Lanka (247 BC). 1,840 steps, hilltop dagobas, panoramic views. Add 2hrs.",g:"Mihintale Sri Lanka"},{i:"🚗",t:"Drive to Kandy (3.5hrs) — arrive ~8–9pm ready for tomorrow night"}],gem:"Mihintale in the late afternoon light is one of the most profound places in Sri Lanka. The hilltop where the monk Mahinda converted the king to Buddhism in 247 BC — 13km from Anuradhapura, $3 entry, almost no tourists.",highlight:"🎆 TOMORROW NIGHT: Randoli Perahera penultimate grand finale in Kandy. You are sleeping in Kandy tonight for this reason. Book your viewing stand seat NOW.",transport:"🚗 Private Driver all day: Habarana → Polonnaruwa → Anuradhapura → Mihintale → Kandy",links:[{l:"📍 Polonnaruwa",u:"https://maps.google.com/?q=Polonnaruwa+Ancient+City+Sri+Lanka"},{l:"📍 Anuradhapura",u:"https://maps.google.com/?q=Anuradhapura+Sri+Lanka"},{l:"📍 Mihintale",u:"https://maps.google.com/?q=Mihintale+Sri+Lanka"}]},{id:15,date:"Wed 26 Aug",region:"finish",title:"🎆 KANDY: Randoli Perahera Grand Night",loc:"Kandy",lat:7.291,lng:80.634,min:20,max:28,rain:38,icon:"🌦",desc:"Warm evening — perfect for the procession",special:!0,img:"https://commons.wikimedia.org/wiki/Special:FilePath/Esala_Perahera_(Procession)_2006,_Kandy,_Sri_Lanka.jpg?width=900",hours:[{t:"Temple of Tooth morning puja: 9:30am",ok:!0},{t:"Perahera procession: starts ~8:00pm, runs 2–3hrs (be in your stand by 7:30pm)",ok:!0},{t:"Viewing stands: book seats in advance via hotel or kandyperaherabookings.com",ok:!1}],warn:null,acts:[{i:"🛕",t:"Temple of Tooth morning — 9:30am puja, then explore the temple museum at leisure"},{i:"🛍",t:"Afternoon: browse Kandy's craft shops for last gifts — batik, Ceylon tea, spices, gems"},{i:"🪑",t:"Be in your viewing stand seat by 7:30pm sharp — the procession begins at ~8pm"},{i:"🎆",t:"RANDOLI PERAHERA — 50–100 decorated elephants, 1,500 performers, fire dancers, whip crackers, Kandyan drummers",u:"https://kandyesalaperahera.com/dates2026/"},{i:"🌙",t:"The Maligawa Tusker carries the sacred golden casket — the most revered elephant in Sri Lanka"}],gem:null,highlight:"★ This is the penultimate Randoli night — one of the most spectacular of the entire festival. The full complement of elephants, the most elaborate costumes, the longest procession. On your last full evening in Sri Lanka. The itinerary planned for this. You are welcome.",transport:"🛺 Tuk-tuk/PickMe within Kandy",links:[{l:"🎆 Official Perahera Dates",u:"https://kandyesalaperahera.com/dates2026/"},{l:"🪑 Book Viewing Seats",u:"https://www.kandyperaherabookings.com/"},{l:"📍 Temple of Tooth",u:"https://www.maligawa.lk/"}]},{id:16,date:"Thu 27 Aug",region:"transit",title:"Morning Puja → Fly Home",loc:"Kandy → CMB Airport · Depart 14:10",lat:7.18,lng:79.884,min:26,max:32,rain:30,icon:"⛅",desc:"Warm, coastal humidity",special:!1,img:"https://picsum.photos/seed/colombo-departure-lights/900/400",hours:[{t:"Temple of Tooth morning puja: 6:30am — final Sri Lanka moment",ok:!0},{t:"Leave Kandy by 8:00am LATEST for 14:10 flight (3.5hrs + airport time)",ok:!1}],warn:"Flight departs 14:10. Leave Kandy by 8:00am latest — allow 3.5hrs driving + 2hrs airport check-in. If there is traffic on the Kandy–Colombo road (common), 7:30am departure is safer.",acts:[{i:"🛕",t:"6:30am final puja at Temple of Tooth — dawn light, almost no crowds, pure magic"},{i:"🚗",t:"Drive Kandy → CMB Airport — depart Kandy 8:00am latest"},{i:"🛒",t:"If time allows: Pettah Market for last-minute spices, tea, arrack",g:"Pettah Market Colombo Sri Lanka"},{i:"✈️",t:"Depart CMB 14:10 — carry your full heart and very full luggage"}],gem:null,highlight:null,transport:"🚗 Private Driver Kandy → CMB Airport — ~$55 total (~3.5hrs)",links:[{l:"✈️ CMB Airport",u:"https://maps.google.com/?q=Bandaranaike+International+Airport"},{l:"📍 Pettah Market",u:"ht nd curry on a screaming-hot iron griddle. The rhythmic metal-on-metal chopping sound is the heartbeat of Sri Lankan night streets."},{name:"Woodapple Juice",desc:"Bizarre, ancient, delicious. Scraped from a hard jungle fruit, mixed with water and jaggery. Tastes like tamarind met rum at a health spa. Try it once — you'll order it again."}]},{region:"Kandy & Hill Country",color:"#1B6B4A",icon:"🍛",items:[{name:"Rice & Curry (full spread)",desc:"The national dish. A mound of rice surrounded by 5–8 small bowls: dhal, jackfruit, fish, potato, gotukola sambol, papadom. Order the full spread at least once — it is a ceremony, not just a meal."},{name:"Kiribath (Milk Rice)",desc:"Thick rice cooked in coconut milk, cut into diamond shapes. Eaten on auspicious days with a burnt-chilli sambol called lunu miris. Ask at your hotel on your first morning — often served free."},{name:"Polos (Young Jackfruit Curry)",desc:"Unripe jackfruit cooked in a deep spice paste — the texture and richness are so convincingly meaty that it regularly fools carnivores. One of the great vegetarian dishes of Asia."},{name:"Kandyan Wattalappam",desc:"A dense, dark coconut milk and jaggery steamed pudding. Spiced with cardamom and nutmeg. The dessert of the Kandyan kingdom. You will not find better than from a street stall near the temple."}]},{region:"Ella & Hill Country Tea",color:"#1B6B4A",icon:"🍵",items:[{name:"String Hoppers (Idiyappam)",desc:"Steamed rice-flour noodle nests — delicate, light, eaten with coconut milk and dal for breakfast. Order with pol sambol (scraped fresh coconut with chilli). Delicious."},{name:"Buffalo Curd & Kithul Treacle",desc:"The Ella signature. Thick, tangy buffalo curd topped with dark kithul palm syrup. Best at the roadside Curd Hut. This has improved the days of every traveller who has tried it."},{name:"Fresh Ceylon Tea at Source",desc:'A proper cup of orange pekoe in a family-run factory — tastes nothing like the supermarket version. Ask for "plain tea, no sugar" the way Sri Lankans drink it. Life-changing.'}]},{region:"East Coast (Passekudah & Trinco)",color:"#0A7EA4",icon:"🦀",items:[{name:"Jaffna-Style Crab Curry",desc:"The east coast speciality. Fresh mud crab in a thin, fiery, tamarind-soured coconut curry. The colour is almost black. The heat is serious. The reward is extraordinary. Order 24hrs ahead."},{name:"Fish Ambul Thiyal",desc:"Dried tuna cooked in a sour-spiced goraka (a jungle fruit like dark tamarind) paste. Intensely flavoured, dry, served in small portions. East coast fishing villages make this better than anywhere."},{name:"Muslim Biryani (Trinco)",desc:"Trincomalee has a large Tamil Muslim community whose biryani — short-grain rice, whole spices, tender chicken or mutton — is extraordinary. Find it near the harbour or ask your hotel to direct you."},{name:"Pol Sambol",desc:"Freshly grated coconut with red chilli, lime, and Maldive fish. Goes with everything. Eaten at every meal by locals. At its best with fresh-caught grilled fish on the beach at sunset."},{name:"King Coconut (Thambili)",desc:"The orange coconut. Ice-cold. Drunk straight from the fruit with a straw. Contains natural electrolytes. After a hot hike or a beach afternoon, this is the greatest thing you will drink all trip."}]},{region:"Cultural Triangle (Habarana area)",color:"#B8680A",icon:"🏺",items:[{name:"Gotukola Sambol",desc:"Raw pennywort leaves (an Ayurvedic herb) mixed with grated coconut, lime, and chilli. Eaten as a salad alongside rice and curry. Cooling, green, medicinal, delicious. Order it everywhere."},{name:"Pumpkin & Coconut Curry",desc:'Temple town cooking: pumpkin simmered in coconut milk with mustard seeds and curry leaves. Simple, deeply comforting. Found at roadside "rice and curry" places near all the ancient sites.'},{name:"Kade Short Eats (Snacks)",desc:"Village bakery staples: fish patties, vegetable rolls, egg roti. Order 3–4 from a roadside kade (bakery shop) for about $1.50. Perfect Cultural Triangle fuel between ruins."},{name:"Treacle Toffee",desc:"Handmade kithul-palm toffee sold near temple towns. Sticky, intense, slightly smoky from the palm sap. Buy a bag — it survives the flight home and makes the best possible souvenir."}]}],N=[{icon:"🛂",title:"Visa / ETA",hl:!0,danger:!1,items:["Most nationalities (US, UK, AU, EU — 40 countries): Free 30-day tourist ETA",'<a href="https://eta.gov.lk/" target="_blank">Apply ONLY at eta.gov.lk</a> — avoid third-party sites charging unnecessary fees',"Passport valid 6+ months from arrival date (12 Aug). Check now.","Print your ETA approval email and carry it at all times in Sri Lanka","Overstaying: fines, possible detention, and future entry bans"]},{icon:"⚠️",title:"2026 Train Warning",hl:!1,danger:!0,items:["Kandy–Nanu Oya rail section SUSPENDED since Cyclone Ditwah (Nov 2025)","Drive from Kandy to Nanu Oya (2.5hrs), then board train to Ella","The Nanu Oya–Ella stretch resumed June 20, 2026 — still scenic!",'Book 2nd class reserved seats at <a href="https://eservices.railway.gov.lk" target="_blank">eservices.railway.gov.lk</a>',"Full Kandy–Ella reopening target: early 2027 (unconfirmed)"]},{icon:"🎆",title:"Perahera 2026 Dates",hl:!0,danger:!1,items:["Kumbal Perahera (5 opening nights): Aug 18–22","Randoli Perahera (5 grand finale nights): Aug 23–26","YOU attend: Aug 26 — penultimate Randoli night, most spectacular","Water-cutting ceremony: Aug 27 early morning (not public)","Day Perahera (final parade): Aug 27 afternoon ~2–4pm",'<a href="https://kandyesalaperahera.com/dates2026/" target="_blank">Official schedule: kandyesalaperahera.com</a>',"<b>Book viewing stand seats NOW</b> — Aug 26 will sell out"]},{icon:"💉",title:"Vaccinations",hl:!1,danger:!1,items:["Hepatitis A — recommended for all travellers (food & water)","Typhoid — recommended (food & water borne)","Tetanus/Diphtheria/Pertussis — update if needed","Hepatitis B — consider for extended rural stays","Yellow fever: ONLY if arriving from an endemic country","See GP or travel clinic at least 6 weeks before 12 August"]},{icon:"🦟",title:"Health on the Ground",hl:!1,danger:!1,items:["Dengue: real risk — use DEET repellent at dawn and dusk without fail","Drink ONLY bottled or purified water. Non-negotiable.","No malaria prophylaxis needed on this specific route","Heat risk at open sites (Sigiriya, Polonnaruwa): visit before 9:30am","Emergency: Police 119 · Ambulance 110 · Tourist Hotline 1912","Get travel insurance with medical evacuation cover"]},{icon:"💵",title:"Money & Cash",hl:!0,danger:!1,items:["Currency: Sri Lankan Rupee (LKR). Verify rate before you go.","CRITICAL: All national parks and heritage sites = cash (LKR) only","Prices quoted in USD but paid in LKR at the day's rate","ATMs: available in cities but NOT near all heritage sites","Crisp USD 100 notes get best rates; worn notes sometimes refused","Best exchange: commercial banks in Kandy or Colombo (not airport)"]},{icon:"📱",title:"Essential Apps",hl:!1,danger:!1,items:['<a href="https://www.pickme.lk/" target="_blank">PickMe</a> — Sri Lanka\'s Uber. Download before you fly.','<a href="https://eservices.railway.gov.lk/" target="_blank">eRail.lk</a> — book Nanu Oya → Ella train tickets',"Maps.me — download offline Sri Lanka map for rural areas","XE Currency — real-time LKR rate converter",'<a href="https://www.kandyperaherabookings.com/" target="_blank">kandyperaherabookings.com</a> — book Perahera viewing stand seats']},{icon:"🛕",title:"Culture & Laws",hl:!1,danger:!1,items:["Cover shoulders AND knees at ALL temples — always. Carry a sarong.","Remove shoes at every Buddhist and Hindu site","No alcohol on Poya (full moon) days — next one: check calendar","Never sit with your back to a Buddha statue for photos","Same-sex relationships criminalised under Sri Lankan law — be discreet","No photography of military or police installations","Drug offences carry severe penalties including long imprisonment"]},{icon:"🧳",title:"Pack for August",hl:!1,danger:!1,items:["Lightweight breathable
